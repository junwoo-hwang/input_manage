<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    --line: #d0d7de;
    --head: #f1f3f5;
    --sel: rgba(26, 86, 219, 0.12);
    --anchor: #1a56db;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: "Pretendard", -apple-system,
               "Segoe UI", "Malgun Gothic", sans-serif; font-size: 13px; }

  .bar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
         padding: 4px 0 6px; }
  .bar button { font-size: 12px; padding: 3px 9px; cursor: pointer;
                border: 1px solid var(--line); border-radius: 5px;
                background: #fff; color: #24292f; }
  .bar button:hover { background: #f3f4f6; }
  .bar button:disabled { opacity: .45; cursor: default; background: #fff; }
  .bar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .bar .where { margin-left: auto; color: #656d76; font-size: 12px;
                font-variant-numeric: tabular-nums; }

  /* 표는 제 크기대로 두고 이 상자가 가로/세로로 스크롤된다. 표를 상자에
     맞춰 줄이면 칸이 좁아져 값이 잘리는데, 기준 정보는 값을 읽으려고 보는
     화면이라 그게 더 나쁘다. */
  .scroll { border: 1px solid var(--line); border-radius: 6px; overflow: auto;
            background: #fff; }
  table { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
           padding: 3px 6px; height: 27px; overflow: hidden; white-space: pre;
           text-overflow: ellipsis; background: #fff; }

  /* 머리글은 스크롤해도 붙어 있는다. 기준 정보는 아래로 수백 줄이라,
     칸 이름이 사라지면 지금 보는 값이 무슨 값인지 알 수가 없다. */
  thead th { position: sticky; top: 0; z-index: 3; background: var(--head);
             font-weight: 600; text-align: left; }
  /* 줄 번호 칸도 옆으로 스크롤할 때 붙어 있는다 */
  .rowhead { position: sticky; left: 0; z-index: 2; background: var(--head);
             color: #656d76; text-align: center; font-variant-numeric: tabular-nums;
             width: 46px; min-width: 46px; cursor: pointer; user-select: none; }
  thead .rowhead { z-index: 4; }
  th.colhead { cursor: pointer; user-select: none; }
  th.colhead.picked, td.picked { background: #e7ebf0; }

  td { cursor: cell; }
  td.sel { background: var(--sel); }
  td.anchor { outline: 2px solid var(--anchor); outline-offset: -2px; }
  td.editing { outline: 2px solid var(--anchor); outline-offset: -2px;
               white-space: pre; overflow: visible; }

  .scroll:focus, .scroll.armed { outline: none;
            box-shadow: 0 0 0 2px rgba(26, 86, 219, .25); }
  /* 화면에서는 안 보이되 초점은 받을 수 있어야 한다. display:none 이나
     visibility:hidden 이면 초점을 못 받아 자판이 안 들어온다. */
  #ghost { position: fixed; top: 0; left: -9999px; width: 1px; height: 1px;
           opacity: 0; border: 0; padding: 0; }
  .empty { padding: 18px; color: #656d76; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <button type="button" data-act="row-above">행 위에</button>
  <button type="button" data-act="row-below">행 아래</button>
  <button type="button" data-act="row-del">행 삭제</button>
  <span class="sep"></span>
  <button type="button" data-act="col-left">열 왼쪽</button>
  <button type="button" data-act="col-right">열 오른쪽</button>
  <button type="button" data-act="col-del">열 삭제</button>
  <span class="sep"></span>
  <button type="button" data-act="undo" title="Ctrl+Z">되돌리기</button>
  <button type="button" data-act="redo" title="Ctrl+Y">다시</button>
  <span class="where" id="where"></span>
</div>
<!-- 고른 칸에 글자를 치기 시작하면 받아주는 숨은 입력칸.
     격자 자체에 자판을 받으면 한글이 안 들어온다: 한글은 keydown 이 아니라
     조합(composition) 으로 들어오는데, 그건 편집 가능한 요소에만 온다.
     그래서 늘 이 칸에 초점을 두고, 여기에 글자가 들어오는 순간 그 글자로
     칸 편집을 시작한다. -->
<input id="ghost" autocomplete="off" aria-hidden="true">
<div class="scroll" id="scroll" tabindex="0"><div class="empty" id="empty">불러오는 중...</div></div>

<script>
// ===================================================================
// Streamlit 컴포넌트 규약.
//
// 별도 빌드(npm/React) 없이 iframe 과 부모 사이의 postMessage 만으로
// 맞춘다. 사내망에서 npm 을 받아야 하는 빌드 단계를 하나 더 두는 것보다,
// 규약 세 가지를 직접 지키는 쪽이 유지보수가 싸다.
// ===================================================================
const send = (msg) => window.parent.postMessage(
  Object.assign({ isStreamlitMessage: true }, msg), "*");

const setValue = (value) =>
  send({ type: "streamlit:setComponentValue", value, dataType: "json" });

let lastHeight = 0;
function syncHeight() {
  const h = Math.ceil(document.documentElement.scrollHeight);
  if (h !== lastHeight) { lastHeight = h; send({ type: "streamlit:setFrameHeight", height: h }); }
}

// ===================================================================
// 표 상태
// ===================================================================
let cols = [];          // 칸 이름
let rows = [];          // rows[r][c] = 문자열
let version = null;     // 파이썬이 준 판 번호. 이게 바뀔 때만 상태를 갈아엎는다
let maxHeight = 520;

// 고른 자리. anchor 는 방금 누른 칸, focus 는 끌고 간 끝.
let anchor = { r: 0, c: 0 };
let focus = { r: 0, c: 0 };
let dragging = false;
let editingCell = null;

const undoStack = [];
const redoStack = [];
const UNDO_MAX = 60;

const scroll = document.getElementById("scroll");
const whereBox = document.getElementById("where");

function snapshot() {
  return { cols: cols.slice(), rows: rows.map(r => r.slice()) };
}

function pushUndo() {
  undoStack.push(snapshot());
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
}

function restore(state) {
  cols = state.cols.slice();
  rows = state.rows.map(r => r.slice());
  clampSelection();
  render();
  publish();
}

// ===================================================================
// 값 다루기
// ===================================================================
function cell(r, c) {
  const row = rows[r];
  if (!row) return "";
  const v = row[c];
  return v === undefined || v === null ? "" : String(v);
}

function setCell(r, c, value) {
  while (rows.length <= r) rows.push(new Array(cols.length).fill(""));
  const row = rows[r];
  while (row.length < cols.length) row.push("");
  row[c] = value;
}

function ensureCols(n) {
  while (cols.length < n) cols.push(nextColName());
  for (const row of rows) while (row.length < cols.length) row.push("");
}

// 새 열 이름. 이미 쓰는 이름과 겹치면 안 된다 -- 겹친 채로 저장하면
// pandas 가 같은 이름 칸 둘을 만들고, 그걸 읽는 쪽에서 값 대신 칸 이름이
// 나오는 표가 된다.
function nextColName(base) {
  const used = new Set(cols.map(String));
  const stem = base || "새칸";
  if (!used.has(stem)) return stem;
  for (let i = 2; ; i++) {
    const name = `${stem}${i}`;
    if (!used.has(name)) return name;
  }
}

function selRange() {
  return {
    r0: Math.min(anchor.r, focus.r), r1: Math.max(anchor.r, focus.r),
    c0: Math.min(anchor.c, focus.c), c1: Math.max(anchor.c, focus.c),
  };
}

function clampSelection() {
  const maxR = Math.max(rows.length - 1, 0);
  const maxC = Math.max(cols.length - 1, 0);
  for (const p of [anchor, focus]) {
    p.r = Math.min(Math.max(p.r, 0), maxR);
    p.c = Math.min(Math.max(p.c, 0), maxC);
  }
}

// ===================================================================
// 그리기
// ===================================================================
function render() {
  if (!cols.length) {
    scroll.innerHTML = `<div class="empty">칸이 없습니다. '열 오른쪽' 으로 만드세요.</div>`;
    syncHeight();
    return;
  }
  const { r0, r1, c0, c1 } = selRange();
  const parts = ['<table><thead><tr><th class="rowhead"></th>'];
  for (let c = 0; c < cols.length; c++) {
    const picked = c >= c0 && c <= c1 ? " picked" : "";
    parts.push(`<th class="colhead${picked}" data-c="${c}" title="${esc(cols[c])}"`
               + ` style="width:${colWidth(c)}px">${esc(cols[c])}</th>`);
  }
  parts.push("</tr></thead><tbody>");
  for (let r = 0; r < rows.length; r++) {
    const picked = r >= r0 && r <= r1 ? " picked" : "";
    parts.push(`<tr><td class="rowhead${picked}" data-r="${r}">${r + 1}</td>`);
    for (let c = 0; c < cols.length; c++) {
      const inSel = r >= r0 && r <= r1 && c >= c0 && c <= c1;
      const cls = (inSel ? "sel" : "") + (r === anchor.r && c === anchor.c ? " anchor" : "");
      parts.push(`<td class="${cls}" data-r="${r}" data-c="${c}">${esc(cell(r, c))}</td>`);
    }
    parts.push("</tr>");
  }
  parts.push("</tbody></table>");
  scroll.innerHTML = parts.join("");
  scroll.style.maxHeight = maxHeight + "px";
  whereBox.textContent =
    `${rows.length}행 x ${cols.length}열 · 선택 ${r1 - r0 + 1}x${c1 - c0 + 1}`;
  syncHeight();
}

// 칸 너비는 내용 길이로 대충 잡는다. 열마다 재서 맞추면 수백 줄짜리에서
// 눈에 띄게 느려지는데, 어차피 늘려 볼 수 있으면 되는 값이다.
function colWidth(c) {
  let w = String(cols[c]).length;
  const n = Math.min(rows.length, 200);
  for (let r = 0; r < n; r++) w = Math.max(w, cell(r, c).length);
  return Math.min(Math.max(w * 8 + 22, 72), 320);
}

function esc(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;");
}

function cellEl(r, c) {
  return scroll.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
}

// ===================================================================
// 파이썬으로 올려보내기
//
// 칸을 누를 때마다 올리면 streamlit 이 그때마다 스크립트를 처음부터 다시
// 돌린다. 한 박자 모았다가 한 번만 올린다.
// ===================================================================
let publishTimer = null;
function publish(immediate) {
  clearTimeout(publishTimer);
  const go = () => setValue({ cols: cols.slice(), rows: rows.map(r => r.slice()) });
  if (immediate) go(); else publishTimer = setTimeout(go, 350);
}

// ===================================================================
// 칸 편집
// ===================================================================
function startEdit(r, c, seed) {
  const td = cellEl(r, c);
  if (!td) return;
  endEdit(false);
  editingCell = { r, c, before: cell(r, c) };
  td.classList.add("editing");
  td.contentEditable = "true";
  td.textContent = seed !== undefined ? seed : cell(r, c);
  td.focus();
  const range = document.createRange();
  range.selectNodeContents(td);
  range.collapse(false);                       // 커서를 끝으로
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function endEdit(commit) {
  if (!editingCell) return;
  const { r, c, before } = editingCell;
  const td = cellEl(r, c);
  editingCell = null;
  if (!td) return;
  const text = td.textContent;
  td.contentEditable = "false";
  td.classList.remove("editing");
  if (commit && text !== before) {
    pushUndo();
    setCell(r, c, text);
    render();
    publish();
  } else {
    td.textContent = cell(r, c);
  }
  // 초점을 숨은 입력칸으로 돌려놓는다. 안 그러면 편집을 마친 뒤 화살표나
  // Ctrl+C 가 이 격자로 안 온다.
  armGhost();
}

// ===================================================================
// 마우스
// ===================================================================
scroll.addEventListener("mousedown", (e) => {
  // 초점을 직접 준다. 아래에서 preventDefault 를 하는데(끌 때 글자가 선택되지
  // 않게 하려고) 그게 브라우저의 기본 초점 이동까지 막는다. 그러면 자판과
  // 붙여넣기가 이 격자가 아니라 바깥 문서로 가서 아무 일도 안 일어난다.
  if (!editingCell) armGhost();
  const th = e.target.closest("th.colhead");
  if (th) {                                    // 열 머리글: 그 열 전체 선택
    endEdit(true);
    const c = Number(th.dataset.c);
    anchor = { r: 0, c };
    focus = { r: Math.max(rows.length - 1, 0), c };
    render();
    return;
  }
  const rowHead = e.target.closest("tbody td.rowhead");
  if (rowHead) {                               // 줄 번호: 그 줄 전체 선택
    endEdit(true);
    const r = Number(rowHead.dataset.r);
    anchor = { r, c: 0 };
    focus = { r, c: Math.max(cols.length - 1, 0) };
    render();
    return;
  }
  const td = e.target.closest("td[data-c]");
  if (!td) return;
  const r = Number(td.dataset.r), c = Number(td.dataset.c);
  if (editingCell && editingCell.r === r && editingCell.c === c) return;
  endEdit(true);
  if (e.shiftKey) {
    focus = { r, c };                          // shift+클릭: 범위 늘리기
  } else {
    anchor = { r, c };
    focus = { r, c };
    dragging = true;                           // 끌어서 범위 선택
  }
  render();
  e.preventDefault();
});

scroll.addEventListener("mouseover", (e) => {
  if (!dragging) return;
  const td = e.target.closest("td[data-c]");
  if (!td) return;
  const r = Number(td.dataset.r), c = Number(td.dataset.c);
  if (r === focus.r && c === focus.c) return;
  focus = { r, c };
  render();
});

document.addEventListener("mouseup", () => { dragging = false; });

scroll.addEventListener("dblclick", (e) => {
  const th = e.target.closest("th.colhead");
  if (th) { renameCol(Number(th.dataset.c)); return; }
  const td = e.target.closest("td[data-c]");
  if (td) startEdit(Number(td.dataset.r), Number(td.dataset.c));
});

function renameCol(c) {
  const name = window.prompt("칸 이름", cols[c]);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  if (trimmed !== cols[c] && cols.includes(trimmed)) {
    window.alert(`'${trimmed}' 은(는) 이미 있는 칸 이름입니다.`);
    return;
  }
  pushUndo();
  cols[c] = trimmed;
  render();
  publish();
}

// ===================================================================
// 자판
// ===================================================================
document.addEventListener("keydown", (e) => {
  if (editingCell) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      const { r, c } = editingCell;
      endEdit(true);
      anchor = focus = { r: Math.min(r + 1, rows.length - 1), c };
      render();
    } else if (e.key === "Escape") {
      e.preventDefault();
      endEdit(false);
    } else if (e.key === "Tab") {
      e.preventDefault();
      const { r, c } = editingCell;
      endEdit(true);
      anchor = focus = { r, c: Math.min(c + 1, cols.length - 1) };
      render();
    }
    return;
  }
  if (!cols.length) return;

  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "c") { copySelection(); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === "x") { copySelection(); clearSelection(); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === "z") { undo(); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === "y") { redo(); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === "v") return;      // paste 이벤트에서 받는다

  const move = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1],
                 ArrowRight: [0, 1] }[e.key];
  if (move) {
    e.preventDefault();
    const target = e.shiftKey ? focus : anchor;
    target.r = Math.min(Math.max(target.r + move[0], 0), rows.length - 1);
    target.c = Math.min(Math.max(target.c + move[1], 0), cols.length - 1);
    if (!e.shiftKey) focus = { r: anchor.r, c: anchor.c };
    render();
    scrollIntoView();
    return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    startEdit(anchor.r, anchor.c);
    return;
  }
  if (e.key === "Delete" || e.key === "Backspace") {
    e.preventDefault();
    clearSelection();
    return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    anchor.c = Math.min(anchor.c + (e.shiftKey ? -1 : 1), cols.length - 1);
    anchor.c = Math.max(anchor.c, 0);
    focus = { r: anchor.r, c: anchor.c };
    render();
    return;
  }
  // 글자를 치면 바로 그 글자로 고쳐 쓰기 시작한다 -- 그 처리는 숨은
  // 입력칸의 input 이벤트가 한다 (아래). keydown 으로 하면 한글이 빠진다.
});

const ghost = document.getElementById("ghost");

function armGhost() {
  ghost.value = "";
  ghost.focus({ preventScroll: true });
  scroll.classList.add("armed");
}

// 숨은 입력칸에 글자가 들어왔다 = 고른 칸에 글자를 치기 시작했다.
// 그 글자를 씨앗 삼아 칸 편집으로 넘긴다. 한글은 여러 번의 조합을 거쳐
// 완성되므로, 넘긴 뒤로는 칸이 직접 조합을 받는다.
ghost.addEventListener("input", () => {
  const seed = ghost.value;
  ghost.value = "";
  if (!seed || editingCell || !cols.length) return;
  startEdit(anchor.r, anchor.c, seed);
});

function scrollIntoView() {
  const td = cellEl(anchor.r, anchor.c);
  if (td) td.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function clearSelection() {
  const { r0, r1, c0, c1 } = selRange();
  pushUndo();
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++) setCell(r, c, "");
  render();
  publish();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
}

// ===================================================================
// 클립보드
//
// 엑셀은 클립보드에 탭으로 칸을, 줄바꿈으로 줄을 나눈 글자를 넣는다.
// 그래서 같은 꼴로 주고받으면 엑셀 <-> 이 화면이 그대로 오간다.
// ===================================================================
function selectionAsTsv() {
  const { r0, r1, c0, c1 } = selRange();
  const out = [];
  for (let r = r0; r <= r1; r++) {
    const line = [];
    for (let c = c0; c <= c1; c++) line.push(cell(r, c));
    out.push(line.join("\t"));
  }
  return out.join("\n");
}

function copySelection() {
  const text = selectionAsTsv();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const box = document.createElement("textarea");
  box.value = text;
  box.style.cssText = "position:fixed;left:-9999px";
  document.body.appendChild(box);
  box.select();
  try { document.execCommand("copy"); } catch (_) { /* 브라우저가 막으면 포기 */ }
  box.remove();
}

document.addEventListener("paste", (e) => {
  if (editingCell) return;                     // 칸 안에 붙여넣는 중이면 그대로 둔다
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text) return;
  e.preventDefault();
  pasteTsv(text);
});

function pasteTsv(text) {
  // 끝의 줄바꿈 하나는 버린다. 엑셀이 늘 붙여서 주는데, 그대로 두면
  // 붙여넣을 때마다 빈 줄이 하나씩 생긴다.
  const body = text.replace(/\r\n/g, "\n").replace(/\n$/, "");
  const grid = body.split("\n").map(line => line.split("\t"));
  if (!grid.length) return;
  pushUndo();
  const wide = Math.max(...grid.map(g => g.length));
  ensureCols(anchor.c + wide);
  for (let i = 0; i < grid.length; i++)
    for (let j = 0; j < grid[i].length; j++)
      setCell(anchor.r + i, anchor.c + j, grid[i][j]);
  focus = { r: anchor.r + grid.length - 1, c: anchor.c + wide - 1 };
  clampSelection();
  render();
  publish();
}

// ===================================================================
// 행/열 넣고 빼기
// ===================================================================
function blankRow() { return new Array(cols.length).fill(""); }

document.getElementById("bar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "undo") return undo();
  if (act === "redo") return redo();

  const { r0, r1, c0, c1 } = selRange();
  const nRows = r1 - r0 + 1, nCols = c1 - c0 + 1;
  pushUndo();

  if (act === "row-above" || act === "row-below") {
    // 고른 줄 수만큼 넣는다. 세 줄을 고르고 누르면 세 줄이 생긴다 (엑셀과 같게)
    const at = act === "row-above" ? r0 : r1 + 1;
    const fresh = Array.from({ length: nRows }, blankRow);
    rows.splice(at, 0, ...fresh);
    anchor = { r: at, c: c0 };
    focus = { r: at + nRows - 1, c: c1 };
  } else if (act === "row-del") {
    rows.splice(r0, nRows);
    if (!rows.length) rows.push(blankRow());
  } else if (act === "col-left" || act === "col-right") {
    const at = act === "col-left" ? c0 : c1 + 1;
    for (let k = 0; k < nCols; k++) {
      cols.splice(at + k, 0, nextColName());
      for (const row of rows) row.splice(at + k, 0, "");
    }
    anchor = { r: r0, c: at };
    focus = { r: r1, c: at + nCols - 1 };
  } else if (act === "col-del") {
    cols.splice(c0, nCols);
    for (const row of rows) row.splice(c0, nCols);
    if (!cols.length) { cols.push(nextColName()); for (const row of rows) row.push(""); }
  }
  clampSelection();
  render();
  publish();
});

// ===================================================================
// 파이썬 -> 여기
// ===================================================================
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  maxHeight = args.max_height || 520;

  // 판 번호가 그대로면 건드리지 않는다. 값을 올려보낼 때마다 streamlit 이
  // 스크립트를 다시 돌리면서 이 자리로 같은 데이터가 되돌아오는데, 그때마다
  // 갈아엎으면 방금 고친 칸과 고른 자리가 통째로 날아간다.
  if (args.version === version) { syncHeight(); return; }

  version = args.version;
  cols = (args.cols || []).map(String);
  rows = (args.rows || []).map(row =>
    (row || []).map(v => (v === null || v === undefined ? "" : String(v))));
  for (const row of rows) while (row.length < cols.length) row.push("");
  if (!rows.length) rows.push(blankRow());
  anchor = { r: 0, c: 0 };
  focus = { r: 0, c: 0 };
  undoStack.length = 0;
  redoStack.length = 0;
  render();
});

send({ type: "streamlit:componentReady", apiVersion: 1 });
syncHeight();
window.addEventListener("resize", syncHeight);
</script>
</body>
</html>
