<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  /* 엑셀 눈에 익은 색으로 맞춘다. 초록(#217346)은 엑셀이 고른 칸에 쓰는 색,
     회색(#f5f5f5)은 머리글 줄 색이다. */
  :root {
    --line: #d4d4d4;
    --head: #f5f5f5;
    --head-line: #b7b7b7;
    --accent: #217346;
    --sel: rgba(33, 115, 70, 0.10);
    --text: #202124;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; color: var(--text);
               font-family: "Pretendard", -apple-system, "Segoe UI",
                            "Malgun Gothic", sans-serif; font-size: 12.5px; }

  /* ---- 위 도구 줄 ----
     테두리 친 버튼을 늘어놓는 대신, 아이콘을 칸 없이 두고 묶음마다 세로선을
     긋는다. x-spreadsheet / 엑셀 리본과 같은 모양이라 어디에 뭐가 있는지
     눈이 먼저 안다. */
  .bar { display: flex; align-items: center; gap: 0; flex-wrap: wrap;
         padding: 3px 4px; margin-bottom: 4px; background: var(--head);
         border: 1px solid var(--line); border-radius: 4px; }
  .bar button { display: inline-flex; align-items: center; gap: 5px;
                height: 26px; padding: 0 7px; margin: 0 1px; cursor: pointer;
                border: 1px solid transparent; border-radius: 3px;
                background: transparent; color: var(--text); font-size: 12px;
                line-height: 1; white-space: nowrap; }
  .bar button:hover { background: #e3e9e6; border-color: #cdd6d1; }
  .bar button:active { background: #d3ddd8; }
  .bar button[disabled] { opacity: .35; cursor: default; background: transparent;
                          border-color: transparent; }
  .bar button svg { width: 15px; height: 15px; flex: 0 0 15px; }

  /* 잠긴 시트 (REV_INFO -- 저장할 때 자동으로 적힌다). 고칠 수 없다는 것을
     위에 한 줄로 알리고, 고치는 단추와 차림표 항목은 흐리게 한다. */
  .locknote { display: none; padding: 4px 8px; margin-bottom: 4px; font-size: 12px;
              background: #fff6e0; border: 1px solid #f0d58a; border-radius: 3px;
              color: #6b5000; }
  body.locked .locknote { display: block; }
  .locknote.flash { background: #ffe39a; }
  body.locked .bar button.edit, body.locked .menu .item.edit {
    opacity: .35; cursor: not-allowed; }
  .bar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 5px; }
  .bar .spring { flex: 1 1 auto; }

  /* 지금 고른 칸의 자리와 값. 엑셀의 이름 상자 + 수식 입력줄 자리다.
     주소는 A1, E1493 처럼 엑셀 표기로 적는다 -- 8000행짜리에서 "지금 어디"
     는 제일 먼저 잃는 정보이고, 사람끼리 자리를 말할 때 쓰는 말이 그거다. */
  .formula { display: flex; align-items: stretch; margin-bottom: 4px;
             border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
             background: #fff; }
  .formula .addr { flex: 0 0 104px; padding: 0 8px; background: var(--head);
                   border-right: 1px solid var(--line); color: var(--text);
                   font-variant-numeric: tabular-nums; font-weight: 600;
                   display: flex; align-items: center; }
  .formula .fx { flex: 0 0 26px; display: flex; align-items: center;
                 justify-content: center; color: #80868b; font-style: italic;
                 border-right: 1px solid var(--line); }
  .formula input { flex: 1; min-width: 0; border: 0; outline: none; padding: 5px 8px;
                   font: inherit; color: var(--text); background: transparent; }
  .formula input:focus { background: #f7fbf9; }

  /* ---- 찾기 ---- */
  .find { display: none; align-items: center; gap: 6px; margin-bottom: 4px;
          padding: 4px 6px; border: 1px solid var(--accent); border-radius: 4px;
          background: #f2f8f5; }
  .find.on { display: flex; }
  .find input { flex: 1; min-width: 0; border: 1px solid var(--line);
                border-radius: 3px; padding: 4px 7px; font: inherit; outline: none; }
  .find input:focus { border-color: var(--accent); }
  .find .hits { color: #5f6368; font-variant-numeric: tabular-nums;
                white-space: nowrap; min-width: 64px; text-align: right; }
  .find button { height: 24px; padding: 0 8px; cursor: pointer; font-size: 12px;
                 border: 1px solid var(--line); border-radius: 3px; background: #fff; }
  .find button:hover { border-color: var(--accent); }
  .cell.hit { background: #fff3c4; }
  .cell.hit-now { background: #ffd54f; outline: 2px solid #f9a825; outline-offset: -2px; }

  /* ---- 표 ----
     <table> 이 아니라 <div> 로 그린다. 보기에는 같지만 이유가 있다: CSS 의
     크기 가둠(containment)이 표의 행에는 적용되지 않게 정해져 있어서,
     <tr> 에는 아래 content-visibility 를 줘도 브라우저가 배치를 건너뛰지
     못한다. 15,000줄에서 재 보면 그 차이가 4,794ms 대 83ms 다. */
  .scroll { border: 1px solid var(--head-line); overflow: auto; background: #fff; }
  .scroll:focus, .scroll.armed { outline: none; }
  .tbl { width: max-content; min-width: 100%; }
  .row, .hrow { display: flex; }
  .cell { flex: 0 0 auto; width: 90px;
          border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
          padding: 2px 6px; height: 25px; line-height: 20px;
          overflow: hidden; white-space: pre; text-overflow: ellipsis;
          background: #fff; cursor: cell; }

  /* 화면 밖 줄은 배치를 미룬다. 줄 자체는 전부 그대로 있어서 스크롤 막대
     길이도, 줄 번호도, 브라우저 자체 찾기도 달라지지 않는다.

     미루는 단위는 줄 하나가 아니라 50줄 묶음(.blk)이다. 브라우저는 미루는
     덩이마다 '지금 화면에 들어왔나' 를 매 그림마다 따지는데, 16,000줄을 줄마다
     따지면 칸 하나 고칠 때마다 그것만 수십 ms 씩 여러 번이었다 (고치는 데 한
     번에 0.45초). 묶으면 따질 것이 320개로 준다.

     미리 알려 주는 높이는 50줄 x 25px = 1250px 이다. .cell 의 실제 높이
     (25px)와 맞아야 막대가 안 튄다 -- 끝 묶음은 줄 수가 모자라서 그 자리에서
     따로 적는다. 검사에서 그려진 높이를 재서 확인한다. */
  .blk { content-visibility: auto; contain-intrinsic-size: 0 1250px; }
  /* 고치는 중인 칸이 든 묶음은 칸이 밖으로 넘쳐 보여야 해서 가둬 두면 안 된다 */
  .blk.editing-blk { content-visibility: visible; }

  /* 머리글은 스크롤해도 붙어 있는다. 아래로 수백 줄인데 칸 이름이 사라지면
     지금 보는 값이 무슨 값인지 알 수가 없다. */
  .hrow { position: sticky; top: 0; z-index: 3; }
  .hrow .cell { background: var(--head); border-bottom: 1px solid var(--head-line);
                font-weight: 600; color: #3c4043; cursor: pointer;
                user-select: none; }
  .rowhead { position: sticky; left: 0; z-index: 2; background: var(--head);
             border-right: 1px solid var(--head-line); color: #5f6368;
             text-align: center; font-variant-numeric: tabular-nums;
             width: 44px; flex: 0 0 44px; cursor: pointer; user-select: none;
             font-weight: 400; }
  .hrow .rowhead { z-index: 4; }
  .cell.picked { background: #e8eeeb; color: var(--accent); }

  .cell.sel { background: var(--sel); }
  .cell.anchor { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cell.editing { outline: 2px solid var(--accent); outline-offset: -2px;
                  white-space: pre; overflow: visible; z-index: 5;
                  position: relative; }

  /* ---- 아래 시트 탭 (엑셀과 같은 자리) ---- */
  .sheetbar { display: flex; align-items: stretch; gap: 2px; padding: 3px 0 0;
              border-top: 1px solid var(--line); overflow-x: auto; }
  .sheetbar .tab { flex: 0 0 auto; padding: 4px 14px; cursor: pointer;
                   border: 1px solid var(--line); border-top: none;
                   border-radius: 0 0 4px 4px; background: var(--head);
                   color: #5f6368; white-space: nowrap; user-select: none; }
  .sheetbar .tab:hover { background: #eef3f0; }
  .sheetbar .tab.on { background: #fff; color: var(--accent); font-weight: 600;
                      border-top: 2px solid var(--accent); padding-top: 3px; }
  .sheetbar .add { flex: 0 0 auto; padding: 4px 10px; cursor: pointer;
                   border: 1px dashed var(--line); border-top: none;
                   border-radius: 0 0 4px 4px; background: transparent;
                   color: #5f6368; }
  .sheetbar .add:hover { color: var(--accent); border-color: var(--accent); }
  .sheetbar .count { margin-left: auto; align-self: center; padding: 0 6px;
                     color: #80868b; font-variant-numeric: tabular-nums;
                     white-space: nowrap; }

  /* ---- 오른쪽 클릭 차림표 ---- */
  .menu { display: none; position: absolute; z-index: 40; min-width: 194px;
          padding: 4px 0; background: #fff; border: 1px solid var(--line);
          border-radius: 5px; box-shadow: 0 6px 18px rgba(0,0,0,.16); }
  .menu.on { display: block; }
  .menu .item { display: flex; align-items: center; gap: 10px; padding: 5px 12px;
                cursor: pointer; white-space: nowrap; }
  .menu .item:hover { background: #eef3f0; }
  .menu .item .key { margin-left: auto; color: #9aa0a6; font-size: 11px;
                     font-variant-numeric: tabular-nums; }
  .menu .item.off { opacity: .4; cursor: default; }
  .menu .item.off:hover { background: transparent; }
  .menu .line { height: 1px; margin: 4px 0; background: var(--line); }

  /* 화면에서는 안 보이되 초점은 받을 수 있어야 한다. display:none 이나
     visibility:hidden 이면 초점을 못 받아 자판이 안 들어온다. */
  #ghost { position: fixed; top: 0; left: -9999px; width: 1px; height: 1px;
           opacity: 0; border: 0; padding: 0; }
  .empty { padding: 18px; color: #5f6368; }
</style>
</head>
<body>
<!-- 순서는 x-spreadsheet / 엑셀 리본을 따른다: 실행취소 · 찾기 · 행 · 열 · 보기 -->
<div class="bar" id="bar">
  <button type="button" data-act="undo" title="실행 취소 (Ctrl+Z)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/>
      <path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg></button>
  <button type="button" data-act="redo" title="다시 실행 (Ctrl+Y)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/>
      <path d="M21 13a9 9 0 1 1-3-7.7L21 8"/></svg></button>
  <span class="sep"></span>

  <button type="button" data-act="find" title="찾기 (Ctrl+F)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    찾기</button>
  <span class="sep"></span>

  <button type="button" class="edit" data-act="row-above" title="고른 줄 위에 넣기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M3 15h18M3 20h18M12 3v8M8 7h8"/></svg>
    행 위</button>
  <button type="button" class="edit" data-act="row-below" title="고른 줄 아래에 넣기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M3 4h18M3 9h18M12 21v-8M8 17h8"/></svg>
    행 아래</button>
  <button type="button" class="edit" data-act="row-del" title="고른 줄 지우기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18M16 9l5 5M21 9l-5 5"/></svg>
    행 삭제</button>
  <span class="sep"></span>

  <button type="button" class="edit" data-act="col-left" title="고른 칸 왼쪽에 넣기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M15 3v18M20 3v18M3 12h8M7 8v8"/></svg>
    열 왼쪽</button>
  <button type="button" class="edit" data-act="col-right" title="고른 칸 오른쪽에 넣기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M4 3v18M9 3v18M21 12h-8M17 8v8"/></svg>
    열 오른쪽</button>
  <button type="button" class="edit" data-act="col-del" title="고른 칸 지우기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M6 3v18M12 3v18M18 3v18M15 8l5 5M20 8l-5 5"/></svg>
    열 삭제</button>
  <span class="sep"></span>

  <button type="button" data-act="fit" title="칸 너비를 내용에 맞춘다">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M8 7L4 12l4 5"/>
      <path d="M16 7l4 5-4 5"/><path d="M4 12h16"/></svg>
    너비 맞춤</button>
  <span class="spring"></span>
</div>

<div class="find" id="find">
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#217346"
       stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/>
    <path d="M20 20l-4-4"/></svg>
  <input id="findInput" placeholder="찾을 값 (Enter 다음, Shift+Enter 이전, Esc 닫기)">
  <span class="hits" id="findHits"></span>
  <button type="button" id="findPrev" title="이전 (Shift+Enter)">&uarr;</button>
  <button type="button" id="findNext" title="다음 (Enter)">&darr;</button>
  <button type="button" id="findClose" title="닫기 (Esc)">&times;</button>
</div>

<!-- 엑셀의 이름 상자 + 수식 입력줄. 주소는 A1 / E1493 표기이고, 오른쪽
     칸에서 값을 바로 고칠 수 있다 (칸을 눌러 고치는 것과 같은 결과). -->
<div class="formula">
  <div class="addr" id="addr"></div>
  <div class="fx">fx</div>
  <input id="val" autocomplete="off" spellcheck="false">
</div>

<!-- 고른 칸에 글자를 치기 시작하면 받아주는 숨은 입력칸.
     격자 자체에 자판을 받으면 한글이 안 들어온다: 한글은 keydown 이 아니라
     조합(composition)으로 들어오는데 그건 편집 가능한 요소에만 온다. 그래서
     늘 이 칸에 초점을 두고, 글자가 들어오는 순간 칸 편집으로 넘긴다. -->
<input id="ghost" autocomplete="off" aria-hidden="true">
<div class="locknote" id="locknote">🔒 이 시트는 저장할 때 자동으로 적힙니다. 여기서는 고칠 수 없습니다 (고르기·복사는 됩니다).</div>
<div class="scroll" id="scroll" tabindex="0"><div class="empty">불러오는 중...</div></div>
<div class="sheetbar" id="sheetbar"></div>

<!-- 오른쪽 클릭 차림표. 차림표의 모든 항목은 도구 줄이나 단축키로도 되는
     것들이다 -- 오른쪽 클릭은 엑셀에서 손이 먼저 가는 자리라서 같이 둔다. -->
<div class="menu" id="menu">
  <div class="item edit" data-act="cut">잘라내기<span class="key">Ctrl+X</span></div>
  <div class="item" data-act="copy">복사<span class="key">Ctrl+C</span></div>
  <div class="item edit" data-act="paste">붙여넣기<span class="key">Ctrl+V</span></div>
  <div class="line"></div>
  <div class="item edit" data-act="row-above">위에 행 삽입</div>
  <div class="item edit" data-act="row-below">아래에 행 삽입</div>
  <div class="item edit" data-act="row-del">행 삭제</div>
  <div class="line"></div>
  <div class="item edit" data-act="col-left">왼쪽에 열 삽입</div>
  <div class="item edit" data-act="col-right">오른쪽에 열 삽입</div>
  <div class="item edit" data-act="col-del">열 삭제</div>
  <div class="line"></div>
  <div class="item edit" data-act="clear">내용 지우기<span class="key">Delete</span></div>
</div>

<script>
// ===================================================================
// Streamlit 컴포넌트 규약.
//
// 별도 빌드(npm/React) 없이 iframe 과 부모 사이의 postMessage 만으로
// 맞춘다. 사내망에서 npm 빌드 단계를 하나 더 두는 것보다, 규약 세 가지를
// 직접 지키는 쪽이 유지보수가 싸다.
// ===================================================================
const send = (msg) => window.parent.postMessage(
  Object.assign({ isStreamlitMessage: true }, msg), "*");

const setValue = (value) =>
  send({ type: "streamlit:setComponentValue", value, dataType: "json" });

let lastHeight = 0;
function syncHeight() {
  const h = Math.ceil(document.documentElement.scrollHeight);
  if (h !== lastHeight) { lastHeight = h; send({ type: "streamlit:setFrameHeight", height: h }); }
}

// ===================================================================
// 상태
//
// 시트 전체를 이 컴포넌트가 들고 있다. streamlit 의 탭으로 시트를 나누면
// 탭이 표 위에 붙어서 엑셀과 다르게 보이고, 시트마다 iframe 이 하나씩
// 생겨서 시트 사이를 오갈 때마다 화면이 끊긴다.
// ===================================================================
let sheets = [];        // [{name, cols, rows}]
let active = 0;
let version = null;     // 파이썬이 준 판 번호. 이게 바뀔 때만 상태를 갈아엎는다
let maxHeight = 520;

// 마지막으로 칠한 선택 범위. 선택이 바뀔 때 표를 통째로 다시 만들지 않고
// 이 사각형과 새 사각형의 칸만 손보려고 들고 있는다 -- 8500행이면 표를 다시
// 만드는 데 5초가 걸려서, 칸 하나 고르는 것조차 못 쓸 만큼 느려진다.
let painted = null;
// 사람이 칸 경계를 끌어 정한 너비. 없으면 내용으로 잡는다.
let colOverride = {};

let anchor = { r: 0, c: 0 };    // 방금 누른 칸
let focus = { r: 0, c: 0 };     // 끌고 간 끝
let dragging = false;
let editingCell = null;

const undoStack = [];
const redoStack = [];
const UNDO_MAX = 60;

const scroll = document.getElementById("scroll");
const sheetbar = document.getElementById("sheetbar");
const addrBox = document.getElementById("addr");
const valBox = document.getElementById("val");
const ghost = document.getElementById("ghost");

// 시트의 줄은 처음 볼 때 푼다. 파이썬은 시트마다 줄들을 JSON 글자 하나로
// 보내고(raw), 여기서 필요할 때 JSON.parse 한다. 다섯 장을 한꺼번에 풀면 첫
// 화면이 그만큼 늦게 뜨는데, 사람은 한 번에 한 장만 본다.
function loadRows(s) {
  if (s.rows) return s.rows;
  mark("parse_start");
  const rs = JSON.parse(s.raw || "[]");
  const w = s.cols.length;
  for (let i = 0; i < rs.length; i++) {
    if (rs[i].length < w) rs[i] = rs[i].concat(new Array(w - rs[i].length).fill(""));
  }
  // 받은 줄들의 목록. 저장할 때 '안 바뀐 줄' 을 알아보는 데 쓴다 (줄을
  // 고치면 늘 새 줄로 갈아 끼우므로, 같은 객체면 안 바뀐 것이다).
  s.base = rs.slice();
  if (!rs.length) rs.push(new Array(w).fill(""));
  s.rows = rs;
  s.raw = null;
  mark("parse_end");
  return rs;
}

// 걸린 시간을 적어 두는 곳. 검사와 실측에서 읽는다 (화면에는 안 쓴다).
window.__marks = [];
const mark = (what) => {
  const m = window.__marks;
  m.push([what, performance.now()]);
  if (m.length > 500) m.splice(0, m.length - 500);   // 끝없이 쌓이지 않게
};

const NO_SHEET = { name: "", cols: [], rows: [] };
// 지금 보는 시트. 늘 풀린 채로 준다 -- 고치는 곳은 전부 여기를 거친다.
const sheet = () => {
  const s = sheets[active];
  if (!s) return NO_SHEET;
  loadRows(s);
  return s;
};
const rowCount = (s) => (s.rows ? s.rows.length : s.n || 0);

// 잠긴 시트(REV_INFO)는 고칠 수 없다. 저장할 때 파이썬이 한 줄씩 붙여 적는
// 시트라, 여기서 고치면 기록이 기록이 아니게 된다. (파이썬도 저장할 때 이
// 시트는 S3 에 있는 그대로 쓴다 -- 여기서 막는 것은 헛수고를 막는 것이다.)
//
// 파일 전체가 잠길 때도 있다: 다른 사람이 이 파일을 고치는 중이면 파이썬이
// "홍길동님이 수정중입니다." 를 내려보내고(readonly), 그동안은 보기·복사만 된다.
let bookLock = "";
const lockedNow = () => !!bookLock || !!(sheets[active] && sheets[active].locked);
const lockNote = document.getElementById("locknote");
const SHEET_LOCK_NOTE = lockNote.textContent;
let flashTimer = null;
let alertQuietUntil = 0;

function showLock() {
  lockNote.textContent = bookLock
    ? `🔒 ${bookLock} 저장하거나 초기화하면 풀립니다. 그때까지는 보기·복사만 됩니다.`
    : SHEET_LOCK_NOTE;
  document.body.classList.toggle("locked", lockedNow());
}

// 잠긴 시트면 막고 안내 줄을 한 번 반짝인다. 막았으면 true.
// 남이 고치는 중인 파일이면 그 말을 창으로도 띄운다 (자판을 칠 때마다
// 뜨지 않게 몇 초에 한 번만).
function refuse() {
  if (!lockedNow()) return false;
  lockNote.classList.add("flash");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => lockNote.classList.remove("flash"), 600);
  if (bookLock && performance.now() > alertQuietUntil) {
    window.alert(bookLock);
    alertQuietUntil = performance.now() + 3000;
  }
  return true;
}
const cols = () => sheet().cols;
const rows = () => sheet().rows;

// 되돌리기 판은 줄 목록만 복사하고 줄 자체는 나눠 쓴다.
//
// 예전에는 판마다 모든 시트의 모든 칸을 복사했다. 52,000줄 x 28칸이면 칸
// 하나 고칠 때마다 146만 칸을 복사했고, 그걸 60판까지 들고 있어 브라우저
// 메모리가 수백 MB 로 불었다. 지금은 줄 목록(52,000개)만 복사한다.
//
// 대신 지킬 것이 하나 있다: 줄(배열)을 그 자리에서 고치면 안 된다. 되돌리기
// 판과 나눠 쓰고 있어서, 고치면 지난 판까지 같이 바뀐다. 줄을 고칠 때는
// 복사해서 고치고 그 자리에 갈아 끼운다 (setCell, ensureCols, 칸 넣고 빼기).
// 아직 안 푼 시트는 푼 글자(raw)를 그대로 들고 간다
const copySheet = (s) => ({ name: s.name, orig: s.orig, touched: s.touched,
                            locked: s.locked,
                            cols: s.cols.slice(), rows: s.rows ? s.rows.slice() : null,
                            raw: s.raw, n: s.n, base: s.base });

function snapshot() {
  return { active, sheets: sheets.map(copySheet) };
}

function pushUndo() {
  undoStack.push(snapshot());
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
  // 되돌리기 판을 뜨는 것은 곧 지금 시트를 고친다는 뜻이다. 저장할 때
  // 파이썬에 이 시트만 올려 보내려고 적어 둔다 (안 고친 시트는 파이썬이
  // 이미 들고 있다).
  sheet().touched = true;
}

function restore(state) {
  sheets = state.sheets.map(copySheet);
  active = Math.min(state.active, sheets.length - 1);
  clampSelection();
  renderAll();
  publish();
}

// ===================================================================
// 값 다루기
// ===================================================================
function cell(r, c) {
  const row = rows()[r];
  if (!row) return "";
  const v = row[c];
  return v === undefined || v === null ? "" : String(v);
}

function setCell(r, c, value) {
  const s = sheet();
  while (s.rows.length <= r) s.rows.push(new Array(s.cols.length).fill(""));
  // 줄은 되돌리기 판과 나눠 쓴다. 복사해서 고치고 갈아 끼운다.
  const row = s.rows[r].slice();
  while (row.length < s.cols.length) row.push("");
  row[c] = value;
  s.rows[r] = row;
}

function ensureCols(n) {
  const s = sheet();
  while (s.cols.length < n) s.cols.push(nextColName());
  const w = s.cols.length;
  s.rows = s.rows.map(row => row.length < w
    ? row.concat(new Array(w - row.length).fill("")) : row);
}

// 새 칸 이름. 쓰고 있는 이름과 겹치면 안 된다 -- 겹친 채로 저장하면 pandas 가
// 같은 이름 칸 둘을 만들고, 그걸 읽는 쪽에서 값 대신 칸 이름이 나오는 표가 된다.
function nextColName(base) {
  const used = new Set(cols().map(String));
  const stem = base || "새칸";
  if (!used.has(stem)) return stem;
  for (let i = 2; ; i++) {
    const name = `${stem}${i}`;
    if (!used.has(name)) return name;
  }
}

function nextSheetName() {
  const used = new Set(sheets.map(s => s.name));
  for (let i = sheets.length + 1; ; i++) {
    const name = `Sheet${i}`;
    if (!used.has(name)) return name;
  }
}

function selRange() {
  return {
    r0: Math.min(anchor.r, focus.r), r1: Math.max(anchor.r, focus.r),
    c0: Math.min(anchor.c, focus.c), c1: Math.max(anchor.c, focus.c),
  };
}

function clampSelection() {
  const maxR = Math.max(rows().length - 1, 0);
  const maxC = Math.max(cols().length - 1, 0);
  for (const p of [anchor, focus]) {
    p.r = Math.min(Math.max(p.r, 0), maxR);
    p.c = Math.min(Math.max(p.c, 0), maxC);
  }
}

// ===================================================================
// 그리기
// ===================================================================
// 표의 뼈대(줄 수, 칸 수, 시트)가 바뀌었을 때만 통째로 다시 만든다.
function renderAll() {
  showLock();
  renderGrid();
  renderSheetBar();
  renderFormula();
  syncHeight();
}

// 고른 자리만 바뀌었을 때. 표는 그대로 두고 칠한 것만 옮긴다.
function repaintSelection() {
  const now = selRange();
  paintRange(painted, false);
  paintRange(now, true);
  painted = now;
  renderSheetBar();
  renderFormula();
}

function paintRange(range, on) {
  if (!range) return;
  const { r0, r1, c0, c1 } = range;
  for (let c = c0; c <= c1; c++) {
    const th = colHeadEl(c);
    if (th) th.classList.toggle("picked", on);
  }
  // 아직 안 그린 줄은 건너뛴다 -- 그릴 때 고른 자리를 보고 칠한다
  for (let r = r0; r <= Math.min(r1, drawn - 1); r++) {
    const row = rowEl(r);
    if (!row) continue;
    row.children[0].classList.toggle("picked", on);
    for (let c = c0; c <= c1; c++) {
      const td = row.children[c + 1];
      if (td) { td.classList.toggle("sel", on); td.classList.remove("anchor"); }
    }
  }
  if (on) {
    const td = cellEl(anchor.r, anchor.c);
    if (td) td.classList.add("anchor");
  }
}

// 칸 하나만 바뀌었을 때. 그 칸의 글자만 고쳐 쓴다.
function repaintCell(r, c) {
  const td = cellEl(r, c);
  if (td) td.textContent = cell(r, c);
  renderFormula();
}

// 줄 하나의 높이. CSS 의 .cell 높이와 같아야 한다 -- 아래 '아직 안 그린
// 만큼' 을 이 값으로 잡아서 스크롤 막대를 미리 맞춰 놓기 때문이다.
// 검사에서 실제로 그려진 높이를 재어 확인한다.
const ROW_H = 25;
// 첫 그림에 넣을 줄 수와, 그 뒤로 한 번에 덧붙일 양.
//
// 15,000줄을 한 번에 그리면 다 끝날 때까지 화면이 비어 있다. 사람이 볼 수
// 있는 것은 첫 화면뿐인데 나머지 14,700줄을 기다리는 셈이다. 먼저 보이는
// 만큼만 내놓고 나머지는 이어 붙인다 -- 줄은 결국 전부 그려지므로
// 브라우저 Ctrl+F 도, 스크롤 막대도 그대로다.
//
// 덧붙이는 양은 줄이 아니라 칸으로 센다. 6칸짜리 시트에 맞춰 3,000줄씩
// 붙이던 것을 28칸짜리에 그대로 쓰니 한 덩이가 8만 칸이 되어 한 번에 0.7초씩
// 멈췄다. 칸 수로 끊으면 시트가 넓어도 한 덩이 무게가 같다.
const FIRST_ROWS = 300;
const CHUNK_CELLS = 18000;
// 줄은 BLOCK 줄씩 묶어 그린다 (.blk -- CSS 의 설명 참고). 덩이는 늘 묶음의
// 배수로 끊어야 묶음이 반쯤 차다 마는 일이 없다.
const BLOCK = 50;
const chunkRows = () => {
  const want = Math.floor(CHUNK_CELLS / Math.max(1, cols().length));
  return Math.max(1, Math.round(want / BLOCK)) * BLOCK;
};
let fillTimer = null;

// from 줄부터 to 줄 앞까지를 묶음들로. from 은 늘 BLOCK 의 배수다.
function blocksHtml(from, to, cs, sel) {
  const parts = [];
  for (let b = from; b < to; b += BLOCK) {
    const end = Math.min(b + BLOCK, to);
    // 모자란 묶음(시트의 끝)은 미리 알려 줄 높이를 그 자리에서 적는다
    const size = end - b === BLOCK ? ""
      : ` style="contain-intrinsic-size:0 ${(end - b) * ROW_H}px"`;
    parts.push(`<div class="blk"${size}>`);
    for (let r = b; r < end; r++) parts.push(rowHtml(r, cs, sel));
    parts.push("</div>");
  }
  return parts.join("");
}

function rowHtml(r, cs, sel) {
  const { r0, r1, c0, c1 } = sel;
  const picked = r >= r0 && r <= r1 ? " picked" : "";
  const parts = [`<div class="row"><div class="cell rowhead${picked}"`
                 + ` data-r="${r}">${r + 1}</div>`];
  for (let c = 0; c < cs.length; c++) {
    const inSel = r >= r0 && r <= r1 && c >= c0 && c <= c1;
    const cls = (inSel ? " sel" : "") + (r === anchor.r && c === anchor.c ? " anchor" : "");
    parts.push(`<div class="cell${cls}" data-r="${r}" data-c="${c}">`
               + `${esc(cell(r, c))}</div>`);
  }
  parts.push("</div>");
  return parts.join("");
}

function renderGrid() {
  if (fillTimer) { cancelAnimationFrame(fillTimer); fillTimer = null; }
  tblEl = null;
  drawn = 0;
  if (!cols().length) {
    scroll.innerHTML = `<div class="empty">칸이 없습니다. '열 오른쪽' 으로 만드세요.</div>`;
    return;
  }
  scroll.style.maxHeight = maxHeight + "px";
  const sel = selRange();
  const { c0, c1 } = sel;
  const cs = cols(), rs = rows();

  // 칸 너비는 칸마다 style 로 붙이지 않고 열마다 규칙 하나로 준다. 15,000줄
  // 이면 칸이 9만 개라, 칸마다 style="width:..." 를 달면 그것만으로 글자가
  // 1MB 넘게 늘어난다.
  const widths = ['<style>'];
  for (let c = 0; c < cs.length; c++) {
    widths.push(`.tbl .cell[data-c="${c}"]{width:${colWidth(c)}px}`);
  }
  widths.push("</style>");

  const parts = [widths.join(""), '<div class="tbl"><div class="hrow">',
                 '<div class="cell rowhead"></div>'];
  for (let c = 0; c < cs.length; c++) {
    const picked = c >= c0 && c <= c1 ? " picked" : "";
    parts.push(`<div class="cell colhead${picked}" data-c="${c}"`
               + ` title="${esc(cs[c])}">${esc(cs[c])}</div>`);
  }
  parts.push("</div>");

  // 줄은 결국 전부 그린다. 보이는 만큼만 그리고 마는 것이 아니다 -- 그러면
  // 브라우저 Ctrl+F 가 값을 못 찾는다. 다만 한꺼번에 말고 나눠서 그린다.
  const first = Math.min(rs.length, FIRST_ROWS);
  parts.push(blocksHtml(0, first, cs, sel));
  // 아직 안 그린 만큼을 미리 자리로 잡아 둔다. 이게 없으면 줄이 붙을 때마다
  // 스크롤 막대가 줄어들어 잡고 있던 자리가 밀린다.
  parts.push(`<div class="filler" style="height:${(rs.length - first) * ROW_H}px"></div>`);
  parts.push("</div>");
  scroll.innerHTML = parts.join("");
  tblEl = scroll.querySelector(".tbl");
  drawn = first;
  painted = sel;
  mark("first_paint");
  if (first < rs.length) fillFrom(first);
}

function fillFrom(from) {
  const rs = rows(), cs = cols();
  const filler = tblEl && tblEl.lastElementChild;
  if (!filler || !filler.classList.contains("filler")) return;
  const to = Math.min(rs.length, from + chunkRows());
  // 고른 자리는 그리는 중에도 바뀔 수 있으므로 덩이마다 다시 본다
  const sel = selRange();
  filler.insertAdjacentHTML("beforebegin", blocksHtml(from, to, cs, sel));
  drawn = to;
  if (to < rs.length) {
    filler.style.height = ((rs.length - to) * ROW_H) + "px";
    fillTimer = requestAnimationFrame(() => fillFrom(to));
  } else {
    filler.remove();
    fillTimer = null;
    mark("filled");
  }
}

function renderSheetBar() {
  const { r0, r1, c0, c1 } = selRange();
  const parts = [];
  sheets.forEach((s, i) => {
    parts.push(`<div class="tab${i === active ? " on" : ""}" data-i="${i}"`
               + ` title="${esc(s.name)} · ${rowCount(s)}행 x ${s.cols.length}열`
               + ` (두 번 누르면 이름 바꾸기)">${esc(s.name)}</div>`);
  });
  parts.push('<button type="button" class="add" id="addSheet" title="시트 추가">+</button>');
  parts.push(`<span class="count">${rows().length}행 x ${cols().length}열`
             + ` · 선택 ${r1 - r0 + 1}x${c1 - c0 + 1}</span>`);
  sheetbar.innerHTML = parts.join("");
}

// 0 -> A, 25 -> Z, 26 -> AA. 엑셀 열 이름 규칙.
function colLetter(c) {
  let out = "";
  for (let n = c; n >= 0; n = Math.floor(n / 26) - 1) {
    out = String.fromCharCode(65 + (n % 26)) + out;
  }
  return out;
}

// 화면의 1행은 엑셀에서 2행이다 -- 엑셀 1행은 칸 이름 줄이기 때문이다.
// 여기를 안 맞추면 "A5 고쳐줘" 하고 엑셀을 열었을 때 한 줄씩 어긋난다.
function addrOf(r, c) { return colLetter(c) + (r + 2); }

function renderFormula() {
  if (!cols().length) { addrBox.textContent = ""; valBox.value = ""; return; }
  addrBox.textContent = addrOf(anchor.r, anchor.c);
  valBox.readOnly = lockedNow();
  addrBox.title = `${sheet().name} · ${cols()[anchor.c]}`;
  if (document.activeElement !== valBox) valBox.value = cell(anchor.r, anchor.c);
}

// 수식 입력줄에서 고치기. 칸을 눌러 고치는 것과 같은 결과여야 한다.
// 한글 조합 중 Enter 는 칸에서와 같이 조합이 끝난 뒤에 처리한다 (아래 '자판').
function formulaEnter() {
  commitFormula();
  anchor = focus = { r: Math.min(anchor.r + 1, rows().length - 1), c: anchor.c };
  // 아래 칸 값으로 먼저 바꿔 둔다. 입력줄은 초점이 있는 동안 새 칸 값으로
  // 안 바뀌는데(renderFormula), 그대로 초점을 빼면 blur 가 방금 친 글자를
  // 아래 칸에 한 번 더 써 넣는다.
  valBox.value = cell(anchor.r, anchor.c);
  repaintSelection();
  armGhost();
}
valBox.addEventListener("compositionend", () => afterComposition(formulaEnter));
valBox.addEventListener("keydown", (e) => {
  if (isEcho(e)) return;
  if (composing(e)) {
    if (isEnter(e)) imeKey = "Enter";
    return;
  }
  if (isEnter(e)) {
    e.preventDefault();
    imeKey = null;
    formulaEnter();
  } else if (e.key === "Escape") {
    e.preventDefault();
    valBox.value = cell(anchor.r, anchor.c);
    armGhost();
  }
});
valBox.addEventListener("blur", commitFormula);

function commitFormula() {
  if (!cols().length || lockedNow()) return;
  const text = valBox.value;
  if (text === cell(anchor.r, anchor.c)) return;
  pushUndo();
  setCell(anchor.r, anchor.c, text);
  repaintCell(anchor.r, anchor.c);
  publish();
}

// 칸 너비는 내용 길이로 대충 잡는다. 열마다 실제로 재서 맞추면 수백 줄에서
// 눈에 띄게 느려지는데, 어차피 늘려 볼 수 있으면 되는 값이다.
function colWidth(c) {
  if (colOverride[c]) return colOverride[c];
  let w = String(cols()[c]).length;
  const rs = rows();
  const n = Math.min(rs.length, 200);
  for (let r = 0; r < n; r++) w = Math.max(w, cell(r, c).length);
  return Math.min(Math.max(w * 7.6 + 20, 68), 320);
}

function esc(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 칸을 찾을 때 선택자(.cell[data-r=..][data-c=..])로 찾으면 브라우저가 표의
// 칸을 처음부터 훑는다. 16,000줄 x 28칸이면 45만 칸이라 한 번에 수십 ms 인데,
// 고른 자리를 칠할 때는 그걸 칸마다 했다. 줄과 칸은 차례대로 그려 두므로
// 몇 번째 자식인지로 바로 집는다.
//   .tbl 의 자식:  [머리줄, 0번 묶음, 1번 묶음, ..., (아직 안 그린 자리)]
//   묶음의 자식:   [BLOCK 개의 줄]
//   줄의 자식:     [줄 번호, 0번 칸, 1번 칸, ...]
let tblEl = null;       // 지금 그려진 .tbl
let drawn = 0;          // 그중 몇 줄까지 그렸나

function rowEl(r) {
  if (!tblEl || r < 0 || r >= drawn) return null;
  const blk = tblEl.children[1 + Math.floor(r / BLOCK)];
  return (blk && blk.children[r % BLOCK]) || null;
}

function cellEl(r, c) {
  const row = rowEl(r);
  return row && c >= 0 ? row.children[c + 1] || null : null;
}

function colHeadEl(c) {
  return tblEl && c >= 0 ? tblEl.children[0].children[c + 1] || null : null;
}

// ===================================================================
// 파이썬으로 올려보내기
//
// 칸을 누를 때마다 올리면 streamlit 이 그때마다 스크립트를 처음부터 다시
// 돌린다. 한 박자 모았다가 한 번만 올린다.
//
// 그리고 고칠 때마다 표를 통째로 올리지는 않는다. 15,000행이면 그게 한 번에
// 0.7MB 이고, 칸 하나 고칠 때마다 그걸 올렸다 파이썬이 표로 되돌리느라 2.6초가
// 걸렸다. 평소에는 '고친 게 있다' 만 올리고, 파이썬이 진짜로 값이 필요할 때
// (저장) 표를 달라고 하면 그때 통째로 올린다.
// ===================================================================
let publishTimer = null;
let rev = 0;            // 몇 번째 올림인지. 파이썬이 같은 값을 두 번 처리하지
                        // 않게 하는 표다 (streamlit 은 마지막 값을 되돌려준다).
let dirty = false;      // 이 판을 받은 뒤로 사람이 뭔가 건드렸는가
let answered = "";      // 마지막으로 응답한 '통째로 달라' 표
let asked = null;       // 표 없이 온 판에 대해 '없다' 고 이미 알렸는가

function publish(immediate) {
  noteChange();                          // 임시 저장은 고칠 때마다 (몇 초 모아서)
  // 한 번만 알린다. 파이썬이 편집 중에 알아야 하는 것은 '고친 게 있다' 하나
  // 뿐인데, 그건 한 번 참이 되면 저장하거나 초기화할 때까지 계속 참이다.
  // 칸마다 알리면 그때마다 streamlit 이 스크립트를 다시 돌려서, 칸 하나
  // 고칠 때마다 화면에 로딩이 번쩍인다. 정작 알려 줄 새 소식은 없이.
  if (dirty) return;
  dirty = true;
  clearTimeout(publishTimer);
  const go = () => {
    window.__sent = (window.__sent || 0) + 1;   // 검사에서 세어 본다
    setValue({ rev: ++rev, dirty: true, full: false, have: version });
  };
  if (immediate) go(); else publishTimer = setTimeout(go, 350);
}

// 파이썬이 표를 달라고 했다. 손댄 시트만 올린다.
//
// 손대지 않은 시트는 파이썬이 이미 들고 있다(내려보낸 그 표). 이름과 '원래
// 이것' 만 알려 주면 파이썬이 제 것을 쓴다. 다섯 장 중 한 장을 고쳤으면
// 14MB 대신 그 한 장만 올라간다. 시트 순서와 이름 바꾼 것은 이 목록으로
// 그대로 전해진다.
//
// 손댄 시트도 통째로 올리지 않는다. 16,000줄 시트에서 4칸을 고쳤으면 바뀐
// 줄만 보내고, 나머지는 '받은 표의 몇 번째부터 몇 줄' 로 짚는다
// ({k: [시작, 개수]}). 통째로 올리면 그 시트 하나가 4.6MB 인데, streamlit
// 은 이 값을 다음 판마다 또 올린다 -- 저장 한 번에 몇 번씩. 그 큰 덩어리가
// 회사 망을 지나다 끊기면 세션이 새로 시작되어 화면이 처음으로 돌아갔다.
function rowsDiff(s) {
  const rs = loadRows(s), base = s.base;
  if (!base) return null;
  const at = new Map();
  for (let i = 0; i < base.length; i++) at.set(base[i], i);
  const out = [];
  let run = null;
  for (const row of rs) {
    const i = at.get(row);
    if (i === undefined) { run = null; out.push(row); continue; }
    if (run && run.k[0] + run.k[1] === i) { run.k[1]++; continue; }
    run = { k: [i, 1] };
    out.push(run);
  }
  return out;
}

function sheetForPython(s) {
  if (!(s.touched || s.orig === undefined)) return { name: s.name, keep: s.orig };
  const diff = s.orig === undefined ? null : rowsDiff(s);
  return diff
    ? { name: s.name, orig: s.orig, cols: s.cols.slice(), diff: diff }
    : { name: s.name, orig: s.orig, cols: s.cols.slice(), rows: loadRows(s) };
}

function publishFull(token) {
  clearTimeout(publishTimer);
  answered = token;
  setValue({
    rev: ++rev, dirty: dirty, full: true, token: token, have: version,
    sheets: sheets.map(sheetForPython),
  });
}

// ===================================================================
// 칸 편집
// ===================================================================
// 칸이 스크롤 창 밖에 있는가. 머리줄과 줄 번호 칸은 붙어 있어서 그만큼 가린다.
function offscreen(td) {
  const a = td.getBoundingClientRect(), v = scroll.getBoundingClientRect();
  return a.top < v.top + ROW_H || a.bottom > v.bottom
      || a.left < v.left + 44 || a.right > v.right;
}

function startEdit(r, c, seed) {
  if (refuse()) return;
  const td = cellEl(r, c);
  if (!td) return;
  // 칸이 화면 밖이면(스크롤해 두고 글자를 치면) 그 칸으로 데려가야 한다.
  // 재는 것은 DOM 을 건드리기 전에 한다 -- 건드린 뒤에 재면 브라우저가
  // 배치를 통째로 다시 셈한다.
  const away = offscreen(td);
  endEdit(false);
  editingCell = { r, c, before: cell(r, c) };
  td.classList.add("editing");
  td.parentElement.parentElement.classList.add("editing-blk");
  td.contentEditable = "true";
  td.textContent = seed !== undefined ? seed : cell(r, c);
  // 초점을 줄 때 브라우저가 스크롤을 따로 셈하지 않게 한다. 그 셈이 45만 칸
  // 표에서는 한 번에 수십 ms 다. 화면 밖일 때만 우리가 데려간다.
  td.focus({ preventScroll: true });
  if (away) td.scrollIntoView({ block: "nearest", inline: "nearest" });
  const range = document.createRange();
  range.selectNodeContents(td);
  range.collapse(false);                       // 커서를 끝으로
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function endEdit(commit) {
  if (!editingCell) return;
  const { r, c, before } = editingCell;
  const td = cellEl(r, c);
  editingCell = null;
  if (!td) return;
  const text = td.textContent;
  td.contentEditable = "false";
  td.classList.remove("editing");
  td.parentElement.parentElement.classList.remove("editing-blk");
  if (commit && text !== before) {
    pushUndo();
    setCell(r, c, text);
    repaintCell(r, c);
    publish();
  } else {
    td.textContent = cell(r, c);
  }
  // 초점을 숨은 입력칸으로 돌려놓는다. 안 그러면 편집을 마친 뒤 화살표나
  // Ctrl+C 가 이 격자로 안 온다.
  armGhost();
}

function armGhost() {
  ghost.value = "";
  ghost.focus({ preventScroll: true });
  scroll.classList.add("armed");
}

// 숨은 입력칸에 글자가 들어왔다 = 고른 칸에 글자를 치기 시작했다. 그 글자를
// 씨앗 삼아 칸 편집으로 넘긴다. 한글은 여러 번의 조합을 거쳐 완성되므로,
// 넘긴 뒤로는 칸이 직접 조합을 받는다.
ghost.addEventListener("input", () => {
  const seed = ghost.value;
  ghost.value = "";
  if (!seed || editingCell || !cols().length) return;
  startEdit(anchor.r, anchor.c, seed);
});

// ===================================================================
// 마우스
// ===================================================================
scroll.addEventListener("mousedown", (e) => {
  // 초점을 직접 준다. 아래에서 preventDefault 를 하는데(끌 때 글자가 선택되지
  // 않게 하려고) 그게 브라우저의 기본 초점 이동까지 막는다. 그러면 자판과
  // 붙여넣기가 이 격자가 아니라 바깥 문서로 가서 아무 일도 안 일어난다.
  if (!editingCell) armGhost();

  // 오른쪽 클릭은 여기서 아무것도 건드리지 않는다. 그대로 두면 아래에서
  // 선택을 그 칸 하나로 접어 버려서, 범위를 골라 놓고 오른쪽 클릭하면
  // 범위가 사라진 채로 차림표가 뜬다 (엑셀은 범위를 지킨다).
  // 선택을 옮길지는 contextmenu 쪽에서 판단한다.
  if (e.button !== 0) return;

  const th = e.target.closest(".colhead");
  if (th) {                                    // 열 머리글: 그 열 전체
    endEdit(true);
    const c = Number(th.dataset.c);
    anchor = { r: 0, c };
    focus = { r: Math.max(rows().length - 1, 0), c };
    repaintSelection();
    return;
  }
  const rowHead = e.target.closest(".row > .rowhead");
  if (rowHead) {                               // 줄 번호: 그 줄 전체
    endEdit(true);
    const r = Number(rowHead.dataset.r);
    anchor = { r, c: 0 };
    focus = { r, c: Math.max(cols().length - 1, 0) };
    repaintSelection();
    return;
  }
  const td = e.target.closest(".cell[data-c][data-r]");
  if (!td) return;
  const r = Number(td.dataset.r), c = Number(td.dataset.c);
  if (editingCell && editingCell.r === r && editingCell.c === c) return;
  endEdit(true);
  if (e.shiftKey) {
    focus = { r, c };                          // shift+클릭: 범위 늘리기
  } else {
    anchor = { r, c };
    focus = { r, c };
    dragging = true;                           // 끌어서 범위 선택
  }
  repaintSelection();
  e.preventDefault();
});

scroll.addEventListener("mouseover", (e) => {
  if (!dragging) return;
  const td = e.target.closest(".cell[data-c][data-r]");
  if (!td) return;
  const r = Number(td.dataset.r), c = Number(td.dataset.c);
  if (r === focus.r && c === focus.c) return;
  focus = { r, c };
  repaintSelection();
});

document.addEventListener("mouseup", () => { dragging = false; });

scroll.addEventListener("dblclick", (e) => {
  const th = e.target.closest(".colhead");
  if (th) { renameCol(Number(th.dataset.c)); return; }
  const td = e.target.closest(".cell[data-c][data-r]");
  if (td) startEdit(Number(td.dataset.r), Number(td.dataset.c));
});

function renameCol(c) {
  if (refuse()) return;
  const name = window.prompt("칸 이름", cols()[c]);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  if (trimmed !== cols()[c] && cols().includes(trimmed)) {
    window.alert(`'${trimmed}' 은(는) 이미 있는 칸 이름입니다.`);
    return;
  }
  pushUndo();
  sheet().cols[c] = trimmed;
  renderAll();
  publish();
}

// ===================================================================
// 아래 시트 탭
// ===================================================================
sheetbar.addEventListener("click", (e) => {
  if (e.target.closest("#addSheet")) {
    pushUndo();
    sheets.push({ name: nextSheetName(), cols: ["새칸"], rows: [[""]] });
    active = sheets.length - 1;
    anchor = focus = { r: 0, c: 0 };
    renderAll();
    publish();
    return;
  }
  const tab = e.target.closest(".tab");
  if (!tab) return;
  const i = Number(tab.dataset.i);
  if (i === active) return;
  endEdit(true);
  active = i;
  anchor = { r: 0, c: 0 };
  focus = { r: 0, c: 0 };
  renderAll();
  armGhost();
});

sheetbar.addEventListener("dblclick", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  const i = Number(tab.dataset.i);
  if (bookLock) { window.alert(bookLock); return; }
  if (sheets[i].locked) {
    window.alert(`'${sheets[i].name}' 은(는) 저장할 때 자동으로 적히는 시트라 이름을 바꿀 수 없습니다.`);
    return;
  }
  const name = window.prompt("시트 이름", sheets[i].name);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed || trimmed === sheets[i].name) return;
  if (sheets.some((s, j) => j !== i && s.name === trimmed)) {
    window.alert(`'${trimmed}' 은(는) 이미 있는 시트 이름입니다.`);
    return;
  }
  pushUndo();
  sheets[i].name = trimmed;
  renderAll();
  publish();
});

// ===================================================================
// 자판
// ===================================================================
// 한글을 치다가 Enter 를 누르면, 그 순간 마지막 글자는 아직 조합 중이다.
// 이때 바로 칸을 닫고 아래로 내려가면 IME 가 마지막 글자(때로는 칸 전체)를
// 새로 초점이 간 아래 칸에 확정해 넣는다 -- 아래 칸 값이 위 칸 글자로
// 덮인다. 그래서 조합 중의 Enter/Tab 은 적어만 두고, 조합이 끝난 뒤에 한
// 번 처리한다. 브라우저에 따라 조합이 끝난 뒤 Enter 가 한 번 더 오는데
// (조합 중 것 + 진짜 것), 그건 두 번 내려가지 않게 버린다.
const isEnter = (e) => e.key === "Enter" || e.code === "Enter" || e.code === "NumpadEnter";
const isTab = (e) => e.key === "Tab" || e.code === "Tab";
const composing = (e) => e.isComposing || e.keyCode === 229;
let imeKey = null;        // 조합 중에 눌러 둔 "Enter" / "Tab"
let imeEchoUntil = 0;     // 이때까지 오는 Enter/Tab 은 방금 처리한 것의 메아리

// 조합이 끝났을 때 눌러 둔 키를 처리한다. 진짜 keydown 이 곧바로 뒤따르는
// 브라우저에서는 그쪽이 먼저 처리하므로 한 박자 기다린다.
function afterComposition(run) {
  setTimeout(() => {
    const key = imeKey;
    if (!key) return;                  // 뒤따른 keydown 이 이미 처리했다
    imeKey = null;
    run(key);
    imeEchoUntil = performance.now() + 250;
  }, 0);
}

function isEcho(e) {
  if (!(isEnter(e) || isTab(e)) || performance.now() > imeEchoUntil) return false;
  imeEchoUntil = 0;
  e.preventDefault();
  return true;
}

function editKey(key, shift) {
  const { r, c } = editingCell;
  endEdit(true);
  anchor = focus = key === "Tab"
    ? { r, c: Math.min(c + 1, cols().length - 1) }
    : { r: Math.min(r + 1, rows().length - 1), c };
  repaintSelection();
}

document.addEventListener("compositionend", (e) => {
  if (e.target === valBox || !editingCell) return;
  afterComposition((key) => { if (editingCell) editKey(key); });
}, true);

// 검색칸이나 수식 입력줄에서 친 키는 그 칸의 것이다. 격자 단축키로 받으면
// 검색어를 지우려고 누른 Backspace 가 골라 둔 칸을 지우고, Enter 가 칸을
// 고치기 시작하고, 붙여넣기가 격자에 퍼진다. (숨은 입력칸은 격자의 것이다.)
function typingInBox(e) {
  const t = e.target;
  return t !== ghost && t instanceof Element && t.matches("input, textarea, select");
}

document.addEventListener("keydown", (e) => {
  if (typingInBox(e)) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
      e.preventDefault();               // 브라우저 찾기 대신 우리 검색칸
      openFind();
    }
    return;
  }
  if (isEcho(e)) return;
  if (editingCell) {
    if (composing(e)) {
      if (isEnter(e) && !e.shiftKey) imeKey = "Enter";
      else if (isTab(e)) { imeKey = "Tab"; e.preventDefault(); }   // 초점이 빠져나가지 않게
      return;                          // 조합이 끝나면 compositionend 에서
    }
    if (isEnter(e) && !e.shiftKey) {
      e.preventDefault();
      imeKey = null;
      editKey("Enter");
    } else if (e.key === "Escape") {
      e.preventDefault();
      endEdit(false);
    } else if (isTab(e)) {
      e.preventDefault();
      imeKey = null;
      editKey("Tab");
    }
    return;
  }
  if (e.key === "Escape") closeMenu();
  if (!cols().length) return;

  const mod = e.ctrlKey || e.metaKey;
  // 복사·잘라내기는 브라우저의 copy/cut 이벤트에서 한다 (아래 '클립보드').
  // 여기서 막으면 그 이벤트가 안 온다. 혹시 안 오면 한 박자 뒤에 직접 한다.
  if (mod && (e.key.toLowerCase() === "c" || e.key.toLowerCase() === "x")) {
    const cut = e.key.toLowerCase() === "x";
    copiedByEvent = false;
    setTimeout(() => {
      if (copiedByEvent) return;
      copySelection();
      if (cut) clearSelection();
    }, 0);
    return;
  }
  if (mod && e.key.toLowerCase() === "z") { undo(); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === "y") { redo(); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === "f") { openFind(); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === "v") return;      // paste 이벤트에서 받는다

  const move = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1],
                 ArrowRight: [0, 1] }[e.key];
  if (move) {
    e.preventDefault();
    const target = e.shiftKey ? focus : anchor;
    target.r = Math.min(Math.max(target.r + move[0], 0), rows().length - 1);
    target.c = Math.min(Math.max(target.c + move[1], 0), cols().length - 1);
    if (!e.shiftKey) focus = { r: anchor.r, c: anchor.c };
    repaintSelection();
    scrollIntoView();
    return;
  }
  if (e.key === "Enter") { e.preventDefault(); startEdit(anchor.r, anchor.c); return; }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); clearSelection(); return; }
  if (e.key === "Tab") {
    e.preventDefault();
    anchor.c = Math.max(Math.min(anchor.c + (e.shiftKey ? -1 : 1), cols().length - 1), 0);
    focus = { r: anchor.r, c: anchor.c };
    repaintSelection();
    return;
  }
  // 글자를 치면 바로 그 글자로 고쳐 쓰기 시작한다 -- 그 처리는 위 숨은
  // 입력칸의 input 이벤트가 한다. keydown 으로 하면 한글이 빠진다.
});

function scrollIntoView() {
  const td = cellEl(anchor.r, anchor.c);
  if (td) td.scrollIntoView({ block: "nearest", inline: "nearest" });
  else scrollToRow(anchor.r, false);
}

// 아직 안 그린 줄로 스크롤한다. 줄 높이가 늘 같아서(ROW_H) 자리를 셈할 수 있다.
function scrollToRow(r, middle) {
  const y = (r + 1) * ROW_H;             // +1 은 머리줄
  scroll.scrollTop = middle ? Math.max(0, y - scroll.clientHeight / 2)
                            : Math.max(0, y - ROW_H);
}

function clearSelection() {
  if (refuse()) return;
  const { r0, r1, c0, c1 } = selRange();
  pushUndo();
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++) { setCell(r, c, ""); repaintCell(r, c); }
  publish();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
}

// ===================================================================
// 클립보드
//
// 엑셀은 클립보드에 탭으로 칸을, 줄바꿈으로 줄을 나눈 글자를 넣는다.
// 같은 꼴로 주고받으면 엑셀 <-> 이 화면이 그대로 오간다.
// ===================================================================
// 칸 안에 탭·줄바꿈·따옴표가 있으면 엑셀처럼 "..." 로 감싸고 안의 " 는 ""
// 로 적는다. 안 그러면 엑셀에 붙일 때 칸 안의 줄바꿈이 줄을 나눠 버린다.
function tsvField(v) {
  return /[\t\n\r"]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function selectionAsTsv() {
  const { r0, r1, c0, c1 } = selRange();
  const out = [];
  for (let r = r0; r <= r1; r++) {
    const line = [];
    for (let c = c0; c <= c1; c++) line.push(tsvField(cell(r, c)));
    out.push(line.join("\t"));
  }
  return out.join("\n");
}

// 엑셀이 클립보드에 넣는 꼴을 줄·칸으로 푼다. 칸은 탭, 줄은 줄바꿈으로
// 나누되, "..." 로 감싼 칸 안의 탭·줄바꿈은 그 칸의 글자다 (엑셀에서 Alt+Enter
// 로 줄을 바꾼 칸). 그냥 줄바꿈마다 자르면 그 칸이 두 줄로 쪼개져서 그 아래
// 줄이 전부 한 칸씩 밀려 들어간다. 짝이 안 맞는 따옴표는 그냥 글자로 둔다.
function parseTsv(text) {
  const t = text.replace(/\r\n?/g, "\n");
  const rows = [];
  let row = [];
  let i = 0;
  const n = t.length;
  const plain = (from) => {
    let k = from;
    while (k < n && t[k] !== "\t" && t[k] !== "\n") k++;
    return k;
  };
  while (true) {
    let field;
    if (t[i] === '"') {
      let j = i + 1, buf = "", closed = false;
      while (j < n) {
        if (t[j] === '"') {
          if (t[j + 1] === '"') { buf += '"'; j += 2; continue; }
          closed = true; j++; break;
        }
        buf += t[j++];
      }
      if (closed && (j >= n || t[j] === "\t" || t[j] === "\n")) {
        field = buf; i = j;
      } else {
        const k = plain(i); field = t.slice(i, k); i = k;
      }
    } else {
      const k = plain(i); field = t.slice(i, k); i = k;
    }
    row.push(field);
    if (i >= n) { rows.push(row); break; }
    if (t[i] === "\t") { i++; continue; }
    i++;                                   // 줄바꿈
    rows.push(row); row = [];
    if (i >= n) break;                     // 엑셀은 끝에 줄바꿈을 하나 붙인다
  }
  return rows;
}

function copySelection() {
  const text = selectionAsTsv();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const box = document.createElement("textarea");
  box.value = text;
  box.style.cssText = "position:fixed;left:-9999px";
  document.body.appendChild(box);
  box.select();
  try { document.execCommand("copy"); } catch (_) { /* 브라우저가 막으면 포기 */ }
  box.remove();
  armGhost();
}

// Ctrl+C / Ctrl+X 는 브라우저가 주는 copy/cut 이벤트에 글자를 실어 보낸다.
// navigator.clipboard 는 https 에서만 있어서, 사내 http 포털에서는 없다 --
// 그때 쓰던 우회로(execCommand)는 비동기로 실패를 확인한 뒤라 가끔 빗나갔다.
// 이 이벤트는 어디서나 바로 된다. 글자(탭/줄바꿈)만 싣는다: 엑셀이나
// 메신저에 붙여도 서식 없이 글자만 들어간다.
let copiedByEvent = false;
function onCopy(e, cut) {
  if (typingInBox(e) || editingCell || !cols().length) return;
  e.preventDefault();
  e.clipboardData.setData("text/plain", selectionAsTsv());
  copiedByEvent = true;
  if (cut) clearSelection();
}
document.addEventListener("copy", (e) => onCopy(e, false));
document.addEventListener("cut", (e) => onCopy(e, true));

document.addEventListener("paste", (e) => {
  if (typingInBox(e)) return;                  // 검색칸·수식 입력줄에 붙여넣는 중
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (editingCell) {
    // 칸을 고치는 중이어도 서식(굵게, 색, 엑셀의 표 모양)은 안 받는다 --
    // 칸 안에 그대로 붙으면 여러 칸 값이 한 칸에 붙어 버린다. 여러 칸을
    // 복사해 왔으면 고치기를 마치고 그 칸부터 칸칸이 펼친다.
    e.preventDefault();
    if (!text) return;
    const one = text.replace(/\r?\n$/, "");
    if (/[\t\n]/.test(one)) { endEdit(true); pasteTsv(text); }
    else document.execCommand("insertText", false, one);
    return;
  }
  if (!text) return;
  e.preventDefault();
  pasteTsv(text);
});

function pasteTsv(text) {
  if (refuse()) return;
  // 끝의 줄바꿈 하나는 버린다 (parseTsv). 엑셀이 늘 붙여서 주는데, 그대로
  // 두면 붙여넣을 때마다 빈 줄이 하나씩 생긴다.
  const grid = parseTsv(text);
  if (!grid.length) return;
  pushUndo();
  const wide = Math.max(...grid.map(g => g.length));
  ensureCols(anchor.c + wide);
  for (let i = 0; i < grid.length; i++)
    for (let j = 0; j < grid[i].length; j++)
      setCell(anchor.r + i, anchor.c + j, grid[i][j]);
  focus = { r: anchor.r + grid.length - 1, c: anchor.c + wide - 1 };
  clampSelection();
  renderAll();
  publish();
}

// ===================================================================
// 찾기
//
// 브라우저의 Ctrl+F 도 되지만(값이 전부 DOM 에 있으므로) 8000행에서는
// 몇 번째 줄인지, 몇 개나 있는지를 같이 알려주는 쪽이 쓸모 있다.
// ===================================================================
const findBox = document.getElementById("find");
const findInput = document.getElementById("findInput");
const findHits = document.getElementById("findHits");
let hits = [];          // [{r, c}]
let hitAt = -1;

function openFind() {
  findBox.classList.add("on");
  findInput.focus();
  findInput.select();
  syncHeight();
}

function closeFind() {
  findBox.classList.remove("on");
  clearHits();
  hits = []; hitAt = -1;
  findHits.textContent = "";
  armGhost();
  syncHeight();
}

function clearHits() {
  for (const el of scroll.querySelectorAll(".cell.hit, .cell.hit-now")) {
    el.classList.remove("hit", "hit-now");
  }
}

// 찾은 칸에 칠하는 것은 이만큼까지만. 'a' 처럼 흔한 글자를 찾으면 몇 만 칸이
// 걸리는데, 그걸 다 칠하느라 한참 멈춘다. 몇 개인지는 전부 센다.
const HIT_PAINT_MAX = 2000;

function runFind() {
  clearHits();
  const q = findInput.value.trim().toLowerCase();
  hits = []; hitAt = -1;
  if (!q) { findHits.textContent = ""; return; }
  // 칸마다 cell() 을 거치면 45만 칸에서 그 한 겹이 눈에 띄게 느리다
  const rs = rows(), n = cols().length;
  for (let r = 0; r < rs.length; r++) {
    const row = rs[r];
    for (let c = 0; c < n; c++) {
      const v = row[c];
      if (v && String(v).toLowerCase().includes(q)) hits.push({ r, c });
    }
  }
  for (let i = 0; i < hits.length && i < HIT_PAINT_MAX; i++) {
    const td = cellEl(hits[i].r, hits[i].c);
    if (td) td.classList.add("hit");
  }
  if (hits.length) gotoHit(0);
  else findHits.textContent = "없음";
}

function gotoHit(i) {
  if (!hits.length) return;
  const prev = hits[hitAt] && cellEl(hits[hitAt].r, hits[hitAt].c);
  if (prev) { prev.classList.remove("hit-now"); prev.classList.add("hit"); }
  hitAt = (i + hits.length) % hits.length;
  const h = hits[hitAt];
  anchor = focus = { r: h.r, c: h.c };
  repaintSelection();
  const td = cellEl(h.r, h.c);
  if (td) {
    td.classList.add("hit-now");
    td.scrollIntoView({ block: "center", inline: "nearest" });
  } else {
    scrollToRow(h.r, true);             // 아직 안 그린 줄이면 자리로 간다
  }
  findHits.textContent = `${hitAt + 1} / ${hits.length}`;
}

findInput.addEventListener("input", runFind);
findInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); gotoHit(hitAt + (e.shiftKey ? -1 : 1)); }
  else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
});
document.getElementById("findNext").addEventListener("click", () => gotoHit(hitAt + 1));
document.getElementById("findPrev").addEventListener("click", () => gotoHit(hitAt - 1));
document.getElementById("findClose").addEventListener("click", closeFind);


// ===================================================================
// 칸 너비 맞춤
// ===================================================================
function fitWidths() {
  // colWidth 가 내용으로 잡으므로 다시 그리기만 하면 된다. 손으로 늘려
  // 둔 너비가 있으면 그것도 여기서 초기화된다.
  colOverride = {};
  renderGrid();
  publish();
}


// ===================================================================
// 행/열 넣고 빼기
// ===================================================================
function blankRow() { return new Array(cols().length).fill(""); }

document.getElementById("bar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (btn) doAction(btn.dataset.act);
});

function doAction(act) {
  if (act === "undo") return undo();
  if (act === "redo") return redo();
  if (act === "find") return openFind();
  if (act === "fit") return fitWidths();
  if (act === "copy") return copySelection();
  if (act === "cut") { copySelection(); clearSelection(); return; }  // 잠겼으면 복사만 된다
  if (act === "paste") return pasteFromClipboard();
  if (act === "clear") return clearSelection();
  if (!cols().length && act !== "col-right" && act !== "col-left") return;
  if (refuse()) return;                    // 줄·칸 넣고 빼기

  const s = sheet();
  const { r0, r1, c0, c1 } = selRange();
  const nRows = r1 - r0 + 1, nCols = c1 - c0 + 1;
  pushUndo();

  if (act === "row-above" || act === "row-below") {
    // 고른 줄 수만큼 넣는다. 세 줄을 고르고 누르면 세 줄이 생긴다 (엑셀과 같게)
    const at = act === "row-above" ? r0 : r1 + 1;
    s.rows.splice(at, 0, ...Array.from({ length: nRows }, blankRow));
    anchor = { r: at, c: c0 };
    focus = { r: at + nRows - 1, c: c1 };
  } else if (act === "row-del") {
    s.rows.splice(r0, nRows);
    if (!s.rows.length) s.rows.push(blankRow());
  } else if (act === "col-left" || act === "col-right") {
    const at = act === "col-left" ? c0 : c1 + 1;
    for (let k = 0; k < nCols; k++) s.cols.splice(at + k, 0, nextColName());
    // 줄은 되돌리기 판과 나눠 쓴다 -- 그 자리에서 splice 하지 않고 새 줄로
    const blanks = new Array(nCols).fill("");
    s.rows = s.rows.map(row => row.slice(0, at).concat(blanks, row.slice(at)));
    anchor = { r: r0, c: at };
    focus = { r: r1, c: at + nCols - 1 };
  } else if (act === "col-del") {
    s.cols.splice(c0, nCols);
    s.rows = s.rows.map(row => row.slice(0, c0).concat(row.slice(c0 + nCols)));
    if (!s.cols.length) {
      s.cols.push(nextColName());
      s.rows = s.rows.map(row => row.concat([""]));
    }
  }
  clampSelection();
  renderAll();
  publish();
  armGhost();
}


// ===================================================================
// 오른쪽 클릭 차림표
//
// 여기 있는 것은 전부 도구 줄이나 단축키로도 되는 일이다. 그래도 두는
// 이유는 엑셀에서 오른쪽 클릭이 손이 먼저 가는 자리라서다.
// ===================================================================
const menu = document.getElementById("menu");

function openMenu(x, y) {
  menu.classList.add("on");
  // 차림표는 iframe 밖으로 못 나간다 (부모 페이지 위로 넘칠 수 없다).
  // 그래서 끝에 붙으면 반대쪽으로 펼치고, 그래도 프레임보다 길면 프레임을
  // 늘린다 -- 시트가 몇 줄뿐일 때 프레임이 차림표보다 짧아서 아래쪽
  // 항목(열 삽입, 내용 지우기)이 통째로 잘려 안 보였다.
  const w = menu.offsetWidth, h = menu.offsetHeight;
  const maxX = document.documentElement.clientWidth - w - 4;
  const maxY = document.documentElement.clientHeight - h - 4;
  menu.style.left = Math.max(2, Math.min(x, maxX)) + "px";
  menu.style.top = Math.max(2, Math.min(y, maxY)) + "px";
  syncHeight();
}

function closeMenu() {
  if (!menu.classList.contains("on")) return;
  menu.classList.remove("on");
  syncHeight();                 // 늘려 둔 프레임을 되돌린다
}

scroll.addEventListener("contextmenu", (e) => {
  const td = e.target.closest(".cell[data-c], .colhead, .rowhead");
  if (!td) return;
  e.preventDefault();
  endEdit(true);

  // 오른쪽 클릭한 칸이 이미 고른 범위 안이면 선택을 그대로 둔다 (엑셀과 같게).
  // 밖이면 그 칸 하나를 고른다 -- 안 그러면 엉뚱한 자리에 행을 넣게 된다.
  const r = Number(td.dataset.r), c = Number(td.dataset.c);
  if (Number.isFinite(r) && Number.isFinite(c)) {
    const { r0, r1, c0, c1 } = selRange();
    if (r < r0 || r > r1 || c < c0 || c > c1) {
      anchor = focus = { r, c };
      repaintSelection();
    }
  }
  armGhost();
  openMenu(e.clientX, e.clientY);
});

menu.addEventListener("click", (e) => {
  const item = e.target.closest(".item");
  if (!item || item.classList.contains("off")) return;
  closeMenu();
  doAction(item.dataset.act);
});

document.addEventListener("mousedown", (e) => {
  if (!menu.contains(e.target)) closeMenu();
}, true);
document.addEventListener("scroll", closeMenu, true);
window.addEventListener("blur", closeMenu);


// 차림표의 '붙여넣기'. Ctrl+V 와 달리 브라우저가 클립보드를 읽어줘야 하는데,
// 그건 권한이 필요하고 iframe 에서는 막혀 있는 경우가 많다. 막히면 조용히
// 아무 일도 안 일어나게 두지 않고 Ctrl+V 를 쓰라고 알려준다.
function pasteFromClipboard() {
  if (!navigator.clipboard || !navigator.clipboard.readText) {
    window.alert("이 브라우저에서는 차림표 붙여넣기가 막혀 있습니다.\nCtrl+V 를 눌러 주세요.");
    return;
  }
  navigator.clipboard.readText()
    .then((text) => { if (text) pasteTsv(text); })
    .catch(() => window.alert(
      "브라우저가 클립보드 읽기를 막았습니다.\nCtrl+V 를 눌러 주세요."));
}


// ===================================================================
// 파이썬 -> 여기
// ===================================================================
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  // 파이썬이 스크립트를 한 판 돌 때마다 여기로 한 번 온다. 몇 판 돌았는지는
  // 검사에서 센다 -- 저장 창에서 사유를 치는 동안에는 안 돌아야 한다.
  window.__rendered = (window.__rendered || 0) + 1;
  maxHeight = args.max_height || 520;
  lastWant = args.want_full || "";
  armBeat(args.beat_ms ?? 60000);
  if (!leaving) unsavedFromPython = !!args.unsaved;
  backupMs = args.backup_ms ?? 10000;
  if (backupMs && backupPending) { backupPending = false; noteChange(); }
  if (leaveToken && args.left === leaveToken && leaveTarget) goOn();
  if ((args.readonly || "") !== bookLock) {
    bookLock = args.readonly || "";
    if (bookLock) endEdit(false);        // 고치던 칸은 접는다
    showLock();
  }

  // 판 번호가 그대로면 건드리지 않는다. 값을 올려보낼 때마다 streamlit 이
  // 스크립트를 다시 돌리면서 이 자리로 같은 데이터가 되돌아오는데, 그때마다
  // 갈아엎으면 방금 고친 칸과 고른 자리, 보고 있던 시트가 통째로 날아간다.
  if (args.version === version) {
    // 판은 그대로다. 파이썬이 '표를 통째로 달라' 고 했으면 그것만 해 준다.
    const want = args.want_full || "";
    if (want && want !== answered) publishFull(want);
    maybeRestore(args.restore);
    syncHeight();
    return;
  }

  // 새 판인데 표가 안 딸려 왔다. 파이썬은 우리가 이 판을 이미 가진 줄 안다
  // -- 격자 틀이 새로 만들어져 들고 있던 표를 잃은 경우다. '없다' 고 알려서
  // 다음 판에 표를 받는다. 한 판에 한 번만 묻는다 (안 그러면 묻고 또 묻는다).
  if (args.sheets === null || args.sheets === undefined) {
    if (asked !== args.version) {
      asked = args.version;
      setValue({ rev: ++rev, dirty: false, full: false, have: null });
    }
    return;
  }

  mark("data_in");
  version = args.version;
  // 줄은 시트마다 JSON 글자 하나로 온다. 지금 보는 시트만 바로 풀고 나머지는
  // 그 시트를 처음 열 때 푼다 (loadRows).
  sheets = args.sheets.map(s => ({
    name: String(s.name), orig: String(s.name), touched: false, locked: !!s.locked,
    cols: (s.cols || []).map(String), rows: null, raw: s.rows_json || "[]",
    n: s.n || 0,
  }));
  if (!sheets.length) sheets = [{ name: "Sheet1", cols: ["새칸"], rows: [[""]] }];
  active = 0;
  anchor = { r: 0, c: 0 };
  focus = { r: 0, c: 0 };
  painted = null;
  undoStack.length = 0;
  redoStack.length = 0;
  renderAll();

  // 새 판을 곧바로 '고친 것 없음' 으로 올려보낸다. streamlit 은 컴포넌트가
  // 마지막에 올린 값을 key 로 기억하고 있어서, 이걸 안 하면 '다시 불러오기'
  // 를 눌러 표는 새로 그려졌는데 파이썬 쪽은 여전히 버린 수정을 들고 있다 --
  // 저장 버튼이 계속 켜져 있고, 그 상태로 저장하면 버린 값이 되살아난다.
  dirty = false;
  answered = "";
  clearTimeout(publishTimer);
  lastBackup = null;
  clearTimeout(backupTimer);
  backupTimer = null;
  // have: 이 판을 받았다. 파이썬은 이걸 보고 다음부터 표를 안 딸려 보낸다.
  setValue({ rev: ++rev, dirty: false, full: false, have: version });
  maybeRestore(args.restore);
});

// 파일을 띄워 두고 있으면 1분마다 '아직 여기 있다' 를 알린다. 파이썬은 그때
// 내 수정 잠금을 이어 가고(고친 것이 있을 때), 남이 고치기 시작했는지·끝냈는지
// 본다. 고친 것이 없는 사람도 보내야 한다 -- 안 그러면 내가 먼저 열어 둔
// 파일을 남이 고치기 시작해도 내가 칸을 칠 때까지 모른다. 그 사이 오가는
// 것이 있어서 오래 가만히 둔 화면의 연결이 끊기는 일도 줄어든다.
// 파이썬이 표를 달라고 해 놓은 동안은 건너뛴다 -- 그 사이 값을 바꾸면 보낸
// 표를 덮어쓴다.
let beatMs = 60000;
let beatTimer = null;
let lastWant = "";
function armBeat(ms) {
  if (ms === beatMs && (beatTimer || !ms)) return;
  beatMs = ms;
  clearInterval(beatTimer);
  beatTimer = null;
  if (!ms) return;                       // 파이썬 쪽에 창이 떠 있다: 쉰다
  beatTimer = setInterval(() => {
    if (!lastWant && version !== null) {
      setValue({ rev: ++rev, dirty: dirty, full: false, have: version, beat: Date.now(),
                 backup: dirty ? lastBackup : null });
    }
  }, beatMs);
}

// ===================================================================
// 임시 저장
//
// 고친 것이 있으면 몇 초(backupMs) 모았다가 '바뀐 줄' 을 파이썬에 올린다
// (저장할 때 올리는 것과 같은 꼴이라 몇 KB). 파이썬이 S3 에 적어 두고, 화면이
// 날아간 뒤 같은 사람이 다시 들어오면 '복구하시겠습니까?' 를 묻는다. 파이썬
// 쪽에 창이 떠 있는 동안은(backupMs 가 0) 미뤘다가 창이 닫히면 보낸다.
// ===================================================================
let backupMs = 10000;
let backupTimer = null;
let backupPending = false;
let backupSeq = 0;
let lastBackup = null;

function noteChange() {
  if (backupTimer || leaving) return;
  backupTimer = setTimeout(sendBackup, backupMs || 1000);
}

function makeBackup() {
  return { id: `${Date.now()}-${++backupSeq}`, sheets: sheets.map(sheetForPython) };
}

function sendBackup() {
  backupTimer = null;
  if (!dirty || bookLock || leaving || version === null) return;
  if (!backupMs) { backupPending = true; return; }
  if (lastWant) { noteChange(); return; }   // 표를 달라고 해 둔 사이에는 덮어쓰지 않는다
  lastBackup = makeBackup();
  setValue({ rev: ++rev, dirty: true, full: false, have: version, backup: lastBackup });
}

// 파이썬이 '이걸로 되살려 달라' 고 보냈다: 임시 저장한 바뀐 줄들. 받은 표
// 위에 얹는다 -- 줄 객체를 그대로 다시 쓰므로, 되살린 뒤에 또 고쳐도 '바뀐
// 줄만' 이 그대로 통한다. 되살린 것도 되돌리기(Ctrl+Z)로 물릴 수 있다.
let restored = "";
function maybeRestore(r) {
  if (!r || r.token === restored || r.version !== version) return;
  restored = r.token;
  try {
    const byOrig = new Map(sheets.map(s => [s.orig, s]));
    const out = [];
    for (const it of r.sheets || []) {
      if (it.keep !== undefined) {
        const src = byOrig.get(String(it.keep));
        if (!src) throw new Error(it.keep);
        out.push(Object.assign(copySheet(src), { name: String(it.name) }));
        continue;
      }
      const src = it.orig !== undefined && it.orig !== null ? byOrig.get(String(it.orig)) : null;
      let rs;
      if (it.diff) {
        if (!src) throw new Error(it.orig);
        loadRows(src);
        const base = src.base;
        rs = [];
        for (const d of it.diff) {
          if (Array.isArray(d)) { rs.push(d.map(String)); continue; }
          const [a, n] = d.k;
          if (a < 0 || n < 0 || a + n > base.length) throw new Error("범위");
          for (let i = a; i < a + n; i++) rs.push(base[i]);
        }
      } else {
        rs = (it.rows || []).map(row => row.map(String));
      }
      const cs = (it.cols || []).map(String);
      if (!rs.length) rs.push(new Array(cs.length).fill(""));
      out.push({ name: String(it.name), orig: src ? src.orig : undefined, touched: true,
                 locked: src ? src.locked : false, cols: cs, rows: rs, raw: null,
                 n: rs.length, base: src ? src.base : undefined });
    }
    if (!out.length) throw new Error("빈 것");
    pushUndo();
    sheets = out;
    active = 0;
    clampSelection();
    renderAll();
  } catch (err) {
    window.alert("임시 저장된 내용을 되살리지 못했습니다. 지금 화면은 그대로입니다.");
    setValue({ rev: ++rev, dirty: dirty, full: false, have: version, restored: r.token,
               restore_failed: true });
    return;
  }
  dirty = true;
  setValue({ rev: ++rev, dirty: true, full: false, have: version, restored: r.token });
}

// ===================================================================
// 고친 것이 있는데 다른 곳으로 가려 하면 묻는다
//
// 포털 메뉴(왼쪽 사이드바, 또는 그 안의 메뉴 컴포넌트 틀)를 누르면 streamlit
// 이 다른 화면을 그리면서 이 격자를 통째로 치운다 -- 고친 것도 같이 사라진다.
// 메뉴는 이 격자 밖(같은 출처의 바깥 문서와 다른 틀)에 있으므로, 거기에
// 누름을 먼저 받는 귀를 단다. 창을 닫거나 새로 고칠 때는 브라우저가 제 말로
// 묻는다 (요즘 브라우저는 우리 문구를 안 띄운다).
// ===================================================================
const LEAVE_MSG = "페이지를 벗어나면 수정 사항이 사라집니다. 벗어나겠습니까?";
let unsavedFromPython = false;           // 엑셀을 올려 둔 것도 저장 안 한 수정이다
const unsaved = () => dirty || unsavedFromPython;
const hooked = new Set();                // 귀를 단 문서들

//
// 누름은 일단 늘 막는다. '확인' 이면 파이썬에 먼저 알리고(고치던 것을 5분 동안
// 임시 저장, 잠금도 그때까지), 그다음 우리가 그 메뉴를 다시 눌러 준다.
// 누름을 그대로 흘려보내던 때는 사내 포털에서 확인을 몇 번씩 눌러야 넘어갔다
// -- 창이 떠 있는 사이 메뉴 쪽이 그 누름을 놓친다. 다시 눌러 준 것도 메뉴가
// 안 받으면, 사람이 한 번 더 누를 때는 묻지 않고 그대로 보낸다.
let leaving = false;
let leaveTarget = null;
let leaveToken = "";

function onLeaveClick(e) {
  // 이 격자가 이미 치워졌으면(벗어나기로 했다) 아무것도 안 한다
  if (leaving || !window.frameElement || !window.frameElement.isConnected || !unsaved()) return;
  // instanceof Element 는 못 쓴다: 바깥 문서·다른 틀의 요소는 그쪽 창의
  // Element 로 만들어져서, 이 틀의 Element 로 견주면 늘 false 다.
  const t = e.target && e.target.nodeType === 1 ? e.target : null;
  if (!t || !t.closest("a, button, li, label, input, select, [role], .nav-link")) return;
  const doc = t.ownerDocument;
  if (doc === window.parent.document && !t.closest('[data-testid="stSidebar"]')) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if (!window.confirm(LEAVE_MSG)) return;
  leaving = true;
  leaveTarget = t;
  leaveToken = "leave-" + Date.now();
  const bk = dirty ? makeBackup() : null;
  dirty = false;                         // 이제 묻지 않는다 (창 닫기 물음도)
  unsavedFromPython = false;
  clearTimeout(backupTimer);
  backupTimer = null;
  setValue({ rev: ++rev, dirty: false, full: false, have: version,
             leave: leaveToken, backup: bk });
  setTimeout(goOn, 4000);                // 파이썬이 답이 없어도 간다
}

function goOn() {
  const t = leaveTarget;
  leaveTarget = null;
  if (t && t.isConnected) t.click();
}

function onBeforeUnload(e) {
  if (!unsaved()) return;
  e.preventDefault();
  e.returnValue = LEAVE_MSG;
  return LEAVE_MSG;
}

function hookLeave() {
  let top;
  try { top = window.parent.document; } catch (err) { return; }   // 출처가 다르면 못 단다
  const docs = [top];
  for (const f of top.querySelectorAll("iframe")) {
    if (f === window.frameElement) continue;
    try { if (f.contentDocument) docs.push(f.contentDocument); } catch (err) { /* 다른 출처 */ }
  }
  for (const d of docs) {
    if (hooked.has(d)) continue;
    d.addEventListener("click", onLeaveClick, true);
    hooked.add(d);
  }
  if (!hooked.has(window.parent)) {
    window.parent.addEventListener("beforeunload", onBeforeUnload);
    hooked.add(window.parent);
  }
}

function unhookLeave() {
  for (const d of hooked) {
    try {
      d.removeEventListener("click", onLeaveClick, true);
      d.removeEventListener("beforeunload", onBeforeUnload);
    } catch (err) { /* 이미 사라진 문서 */ }
  }
  hooked.clear();
}
// 메뉴 틀은 늦게 뜨거나 새로 만들어지기도 해서 몇 초마다 다시 훑는다
setInterval(hookLeave, 2000);
hookLeave();
window.addEventListener("pagehide", unhookLeave);

send({ type: "streamlit:componentReady", apiVersion: 1 });
syncHeight();
window.addEventListener("resize", syncHeight);
</script>
</body>
</html>
